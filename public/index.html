<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eunomia Marketing Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F4F7F4;color:#1C2B1D;font-size:14px;}
.topbar{background:#2C3E2D;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;border-bottom:2px solid #E8651A;position:sticky;top:0;z-index:100;}
.logo-text{color:#fff;font-weight:700;font-size:14px;letter-spacing:0.02em;}
.logo-sub{color:#a8c5a9;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;}
.status-dot{font-size:11px;border-radius:5px;padding:3px 8px;font-weight:600;margin-left:4px;}
.status-live{background:#3d8b4025;color:#5db860;border:1px solid #3d8b4050;}
.status-demo{background:#E8651A25;color:#E8651A;border:1px solid #E8651A50;}
.status-loading{background:#ffffff20;color:#a8c5a9;}
.tabs{border-bottom:1px solid #E2E8E2;background:#fff;padding:0 24px;display:flex;overflow-x:auto;}
.tab{background:none;border:none;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:#5C6B5D;white-space:nowrap;}
.tab.active{color:#3d8b40;border-bottom-color:#3d8b40;}
.content{padding:24px;max-width:960px;margin:0 auto;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.stat{background:#fff;border:1px solid #E2E8E2;border-radius:12px;padding:16px 18px;}
.stat-label{font-size:11px;font-weight:600;color:#5C6B5D;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.stat-value{font-size:26px;font-weight:700;color:#1C2B1D;line-height:1.1;}
.stat-sub{font-size:12px;color:#5C6B5D;margin-top:4px;}
.card{background:#fff;border:1px solid #E2E8E2;border-radius:14px;padding:20px;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:700;color:#1C2B1D;margin-bottom:14px;}
.btn{border:none;border-radius:8px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:#3d8b40;color:#fff;}
.btn-primary:hover{background:#2d6b30;}
.btn-primary:disabled{background:#E2E8E2;color:#9CA3AF;cursor:default;}
.btn-secondary{background:#fff;border:1px solid #E2E8E2;color:#5C6B5D;}
.btn-amber{background:#E8651A;color:#fff;}
.btn-orange{background:#FF7A59;color:#fff;}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E2E8E2;font-size:13px;}
.row:last-child{border-bottom:none;}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;}
.alert{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:10px;}
.alert-warning{background:#FEF0E8;border:1px solid #E8651A30;}
.alert-error{background:#FEE2E2;border:1px solid #DC262630;}
.alert-success{background:#EBF5EC;border:1px solid #3d8b4030;}
.alert-info{background:#EBF5EC;border:1px solid #3d8b4040;}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid #E2E8E2;border-radius:8px;padding:9px 12px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:#3d8b40;}
.banner{border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.chat-box{background:#F5F6F5;border-radius:10px;padding:12px;min-height:200px;max-height:280px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.chat-user{background:#3d8b40;color:#fff;border-radius:12px 12px 2px 12px;padding:10px 14px;font-size:13px;max-width:80%;margin-left:auto;word-break:break-word;}
.chat-ai{background:#E5E7EB;color:#1C2B1D;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:13px;max-width:85%;white-space:pre-wrap;line-height:1.6;word-break:break-word;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #3d8b4030;border-top-color:#3d8b40;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.seq-grid{display:grid;grid-template-columns:1fr 90px 70px 80px 90px;gap:8px;align-items:center;}
.hunter-grid{display:grid;grid-template-columns:36px 1fr 1fr 100px 80px;gap:8px;align-items:center;}
.tbl-hdr{font-size:11px;font-weight:600;color:#5C6B5D;text-transform:uppercase;letter-spacing:0.05em;padding:8px 12px;background:#F5F6F5;}
.tbl-row{padding:10px 12px;border-top:1px solid #E2E8E2;cursor:pointer;}
.tbl-row:hover{background:#F9FAFB;}
.tbl-row.selected{background:#EBF5EC;}
.check{width:18px;height:18px;border-radius:4px;border:2px solid #E2E8E2;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.check.on{background:#3d8b40;border-color:#3d8b40;color:#fff;}
.msg-card{border:1px solid #E2E8E2;border-radius:10px;overflow:hidden;margin-bottom:12px;}
.msg-hdr{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;}
.msg-body{padding:14px 16px;font-size:13px;line-height:1.7;white-space:pre-wrap;}
.email-preview{border:1px solid #E2E8E2;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(44,62,45,0.1);}
.email-chrome{background:#F4F7F4;padding:10px 16px;border-bottom:1px solid #E2E8E2;display:flex;align-items:center;gap:8px;}
.email-chrome-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px;}
.email-header{background:#2C3E2D;padding:16px 24px;border-bottom:3px solid #E8651A;}
.email-meta{background:#FAFAFA;padding:12px 24px;border-bottom:1px solid #E2E8E2;}
.email-body{background:#fff;padding:32px 40px;max-height:400px;overflow-y:auto;}
.email-footer{background:#F4F7F4;padding:16px 24px;border-top:1px solid #E2E8E2;text-align:center;font-size:11px;color:#5C6B5D;}
.topic-card{border:1.5px solid #E2E8E2;border-radius:10px;padding:14px;cursor:pointer;background:#fff;}
.topic-card:hover{border-color:#3d8b4060;}
.topic-card.selected{border-color:#3d8b40;background:#EBF5EC;}
.tag{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:2px 6px;margin:2px 2px 0 0;}
.toggle-btn{padding:8px 18px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #E2E8E2;background:#fff;color:#5C6B5D;}
.toggle-btn.active{background:#3d8b40;color:#fff;border-color:#3d8b40;}
#refresh-btn{background:none;border:1px solid #ffffff40;border-radius:7px;color:#a8c5a9;font-size:12px;padding:4px 12px;cursor:pointer;font-family:inherit;margin-left:8px;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px;">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="17" fill="white" stroke="#E8651A" stroke-width="2"/>
      <circle cx="18" cy="18" r="13" fill="none" stroke="#3d8b40" stroke-width="1.5"/>
      <path d="M11 18 L16 23 L25 12" stroke="#3d8b40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="logo-text">EUNOMIA PHARMA</div>
      <div class="logo-sub">Marketing Hub</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
    <span id="dot-li" class="status-dot status-loading">LinkedIn</span>
    <span id="dot-sr" class="status-dot status-loading">Sales Robot</span>
    <span id="dot-mc" class="status-dot status-loading">Mailchimp</span>
    <span id="dot-ht" class="status-dot status-loading">Hunter.io</span>
    <button id="refresh-btn" onclick="loadAll()">Refresh</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="showTab('overview')">Overview</button>
  <button class="tab" onclick="showTab('linkedin')">LinkedIn</button>
  <button class="tab" onclick="showTab('salesrobot')">Sales Robot</button>
  <button class="tab" onclick="showTab('mailchimp')">Mailchimp</button>
  <button class="tab" onclick="showTab('hunter')">Hunter.io</button>
  <button class="tab" onclick="showTab('newsletter')">Newsletter</button>
  <button class="tab" onclick="showTab('regulatory')">Regulatory</button>
  <button class="tab" onclick="showTab('clients')">Clients</button>
</div>

<!-- CONTENT PANELS -->
<div class="content">
  <div id="panel-overview"></div>
  <div id="panel-linkedin" style="display:none"></div>
  <div id="panel-salesrobot" style="display:none"></div>
  <div id="panel-mailchimp" style="display:none"></div>
  <div id="panel-hunter" style="display:none"></div>
  <div id="panel-newsletter" style="display:none"></div>
  <div id="panel-regulatory" style="display:none"></div>
  <div id="panel-clients" style="display:none"></div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
var STATE = {
  mc: null, ht: null, li: null, sr: null,
  mock: {}, errors: {},
  chatHist: [],
  draft: '', draftSubj: '',
  topics: [], selTopics: [],
  composerOpen: false, composerStep: 'topics',
  leads: null, hunterView: 'search',
  campaign: null, showCreator: false,
  showComposer: false,
  currentTab: 'overview'
};

var MOCK = {
  mc: {subscribers:834,openRate:'31.4',lastSent:new Date(Date.now()-25*86400000).toISOString(),
    lastSubject:'PMCPA Social Media Guidance: What It Means For Your Team',
    campaigns:[
      {id:'1',name:'PMCPA Social Media Guidance Alert',date:'08/04/2025',sent:834,opens:'34.2%',clicks:'5.1%',status:'sent'},
      {id:'2',name:'March Regulatory Roundup',date:'18/03/2025',sent:801,opens:'29.7%',clicks:'3.9%',status:'sent'},
      {id:'3',name:'ABPI Code 2024 Key Changes',date:'28/02/2025',sent:788,opens:'38.1%',clicks:'6.2%',status:'sent'}
    ]},
  ht:{creditsUsed:312,creditsTotal:500,verificationUsed:289,verificationTotal:500,plan:'Starter'},
  li:{name:'Eunomia Consulting',connections:1247,email:''},
  sr:{summary:{activeSequences:4,messagesSent:586,replies:86,replyRate:'24.1'},
    campaigns:[
      {name:'List 1: Medical Directors',sent:194,replies:24,rate:'25.29',status:'active'},
      {name:'Legal',sent:213,replies:35,rate:'25.72',status:'active'},
      {name:'Compliance and Ethics',sent:120,replies:20,rate:'21.42',status:'active'},
      {name:'Pharma Leaders - Compliance Ethics Medical Legal',sent:59,replies:7,rate:'21.77',status:'active'}
    ]}
};

// ============================================================
// HELPERS
// ============================================================
function daysSince(iso){return Math.floor((Date.now()-new Date(iso))/86400000);}
function nextDue(iso){var d=new Date(iso);d.setDate(d.getDate()+30);return d;}
function daysUntil(iso){return Math.max(0,Math.ceil((nextDue(iso)-Date.now())/86400000));}
function fmtDate(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pill(label,color){return '<span class="pill" style="background:'+color+'18;color:'+color+'">'+esc(label)+'</span>';}
function spinner(){return '<span class="spinner"></span>';}
function alert_(type,html){var cls={warning:'alert-warning',error:'alert-error',success:'alert-success',info:'alert-info'}[type]||'alert-info';return '<div class="alert '+cls+'">'+html+'</div>';}

async function apiGet(path){
  try{var r=await fetch(path);return await r.json();}
  catch(e){return{error:e.message};}
}
async function apiPost(path,body){
  try{var r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
  catch(e){return{error:e.message};}
}
async function callClaude(messages,system){
  var r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages,system:system})});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||'AI error '+r.status);}
  var d=await r.json();
  if(d.error)throw new Error(d.error);
  // Handle both streaming-style and direct response
  if(d.content&&Array.isArray(d.content)){return d.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');}
  if(typeof d==='string')return d;
  // Parse SSE-style fake stream response
  var text=String(d);
  return text;
}

// Non-streaming Claude call - returns full text
async function aiCall(messages,system){
  var r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages,system:system})});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||'AI error '+r.status);}
  // Read the SSE response
  var reader=r.body.getReader();
  var dec=new TextDecoder();
  var full='';
  while(true){
    var rv=await reader.read();
    if(rv.done)break;
    var lines=dec.decode(rv.value,{stream:true}).split('\n');
    for(var i=0;i<lines.length;i++){
      if(lines[i].startsWith('data: ')){
        try{
          var j=JSON.parse(lines[i].slice(6));
          if(j.type==='content_block_delta'&&j.delta&&j.delta.text)full+=j.delta.text;
        }catch(x){}
      }
    }
  }
  if(!full)throw new Error('No response. Check ANTHROPIC_API_KEY has credits.');
  return full;
}

// ============================================================
// TAB SWITCHING
// ============================================================
function showTab(id){
  STATE.currentTab=id;
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.remove('active');
    // Match tab to id by checking onclick attribute
    var oc=t.getAttribute('onclick')||'';
    if(oc.indexOf("'"+id+"'")>=0||oc.indexOf(id)>=0)t.classList.add('active');
  });
  document.querySelectorAll('[id^="panel-"]').forEach(function(p){p.style.display='none';});
  var panel=document.getElementById('panel-'+id);
  if(panel)panel.style.display='block';
  renderTab(id);
}
function renderTab(id){
  if(id==='overview')renderOverview();
  else if(id==='linkedin')renderLinkedIn();
  else if(id==='salesrobot')renderSalesRobot();
  else if(id==='mailchimp')renderMailchimp();
  else if(id==='hunter')renderHunter();
  else if(id==='newsletter')renderNewsletter();
  else if(id==='regulatory')renderRegulatory();
  else if(id==='clients')renderClients();
}

// ============================================================
// STATUS DOTS
// ============================================================
function setDot(id,state){
  var el=document.getElementById('dot-'+id);
  if(!el)return;
  el.className='status-dot';
  if(state==='live'){el.classList.add('status-live');el.textContent='Live: '+el.textContent.replace(/^(Live|Demo): /,'');}
  else if(state==='demo'){el.classList.add('status-demo');el.textContent='Demo: '+el.textContent.replace(/^(Live|Demo): /,'');}
  else{el.classList.add('status-loading');}
}

// ============================================================
// LOAD ALL PLATFORMS
// ============================================================
async function loadAll(){
  ['li','sr','mc','ht'].forEach(function(k){setDot(k,'loading');});
  // Show loading state immediately so page is not blank
  renderTab(STATE.currentTab);
  var results=await Promise.all([
    apiGet('/api/mailchimp?action=stats'),
    apiGet('/api/hunter?action=account'),
    apiGet('/api/linkedin?action=profile'),
    apiGet('/api/salesrobot?action=campaigns')
  ]);
  var mcD=results[0],htD=results[1],liD=results[2],srD=results[3];
  
  if(mcD.error){STATE.mock.mc=true;STATE.mc=MOCK.mc;setDot('mc','demo');}
  else{STATE.mc=mcD;setDot('mc','live');}
  
  if(htD.error){STATE.mock.ht=true;STATE.ht=MOCK.ht;setDot('ht','demo');}
  else{STATE.ht=htD;setDot('ht','live');}
  
  if(liD.error){STATE.mock.li=true;STATE.li=MOCK.li;setDot('li','demo');}
  else{STATE.li=liD;setDot('li','live');}
  
  if(srD.error){STATE.mock.sr=true;STATE.sr=MOCK.sr;setDot('sr','demo');}
  else{STATE.sr=srD;setDot('sr','live');}
  
  renderTab(STATE.currentTab);
}

// ============================================================
// STAT CARD
// ============================================================
function statCard(label,value,sub){
  return '<div class="stat"><div class="stat-label">'+esc(label)+'</div><div class="stat-value">'+esc(value||'--')+'</div>'+(sub?'<div class="stat-sub">'+esc(sub)+'</div>':'')+'</div>';
}

// ============================================================
// OVERVIEW
// ============================================================
function renderOverview(){
  var mc=STATE.mc,ht=STATE.ht,li=STATE.li,sr=STATE.sr;
  var html='';
  
  // Demo notice
  var demos=Object.keys(STATE.mock);
  if(demos.length)html+=alert_('warning','Demo mode: '+demos.join(', ')+' showing sample data. Add API keys in Vercel to see live data.');
  
  // Stats
  html+='<div class="grid4">';
  html+=statCard('LinkedIn Connections',li&&li.connections?li.connections.toLocaleString():'--',li&&li.name&&li.name!=='undefined undefined'?li.name:'');
  html+=statCard('Reply Rate',sr&&sr.summary?sr.summary.replyRate+'%':'--',sr?sr.summary.replies+' replies from '+sr.summary.messagesSent+' sent':'');
  html+=statCard('Open Rate',mc&&mc.openRate?mc.openRate+'%':'--',mc?mc.subscribers.toLocaleString()+' subscribers':'');
  html+=statCard('Hunter Credits',ht?ht.creditsUsed+'/'+ht.creditsTotal:'--',ht?ht.plan:'');
  html+='</div>';
  
  // Newsletter banner
  if(mc&&mc.lastSent){
    var due=daysUntil(mc.lastSent);
    var bgc=due<=7?'#FEF0E8':'#EBF5EC';
    var bdc=due<=7?'#E8651A':'#3d8b40';
    html+='<div class="banner" style="background:'+bgc+';border:1px solid '+bdc+'30;">';
    html+='<div><div style="font-size:12px;font-weight:600;color:'+bdc+';margin-bottom:4px;">'+(due<=7?'Newsletter due soon':'Newsletter schedule')+'</div>';
    html+='<div style="font-size:14px;font-weight:600;">Next due: '+fmtDate(nextDue(mc.lastSent))+' <span style="font-weight:400;color:#5C6B5D;">('+due+' days)</span></div>';
    html+='<div style="font-size:12px;color:#5C6B5D;margin-top:2px;">Last sent '+daysSince(mc.lastSent)+' days ago</div></div>';
    html+='<button class="btn btn-primary" onclick="goNewsletter()">Create Newsletter</button>';
    html+='</div>';
  }
  
  // Two col
  html+='<div class="grid2">';
  
  // Chat
  html+='<div class="card"><div class="card-title">AI Marketing Assistant</div>';
  html+='<div class="chat-box" id="chat-messages">';
  if(STATE.chatHist.length===0)html+='<div style="color:#5C6B5D;font-size:13px;">Ask about your platform performance, newsletter timing, outreach strategy...</div>';
  STATE.chatHist.forEach(function(m){
    html+='<div style="display:flex;justify-content:'+(m.role==='user'?'flex-end':'flex-start')+'">';
    html+='<div class="'+(m.role==='user'?'chat-user':'chat-ai')+'">'+esc(m.content)+'</div></div>';
  });
  html+='</div>';
  html+='<div style="display:flex;gap:8px;"><input id="chat-input" placeholder="How is my reply rate? When should I send next?" onkeydown="if(event.key===\'Enter\')sendChat()"/>';
  html+='<button class="btn btn-primary" onclick="sendChat()">Send</button></div></div>';
  
  // Campaigns
  html+='<div class="card"><div class="card-title">Recent Mailchimp Campaigns</div>';
  if(mc&&mc.campaigns){
    mc.campaigns.forEach(function(c){
      html+='<div class="row"><div style="flex:1"><div style="font-weight:600;">'+esc(c.name)+'</div><div style="font-size:12px;color:#5C6B5D;">'+esc(c.date)+' &middot; '+esc(String(c.sent))+' sent</div></div>';
      html+=pill(c.opens,'#3d8b40')+' '+pill(c.clicks,'#3d8b40')+'</div>';
    });
  }
  html+='</div></div>';
  
  document.getElementById('panel-overview').innerHTML=html;
}

async function sendChat(){
  var input=document.getElementById('chat-input');
  if(!input||!input.value.trim())return;
  var msg=input.value.trim();
  input.value='';
  STATE.chatHist.push({role:'user',content:msg});
  renderOverview();
  var mc=STATE.mc,ht=STATE.ht,li=STATE.li,sr=STATE.sr;
  var sys='You are Eunomia marketing assistant. Data: Mailchimp: '+(mc?mc.subscribers+' subscribers, '+mc.openRate+'% open rate. Last newsletter '+daysSince(mc.lastSent)+' days ago. Next due: '+fmtDate(nextDue(mc.lastSent))+' ('+daysUntil(mc.lastSent)+' days away).':'Not connected.')+' Hunter: '+(ht?ht.creditsUsed+'/'+ht.creditsTotal+' credits.':'Not connected.')+' Sales Robot: '+(sr?sr.summary.activeSequences+' sequences, '+sr.summary.replyRate+'% reply rate.':'Not connected.')+' Give specific actionable pharma compliance marketing advice.';
  try{
    var reply=await aiCall(STATE.chatHist,sys);
    STATE.chatHist.push({role:'assistant',content:reply});
  }catch(e){
    STATE.chatHist.push({role:'assistant',content:'Error: '+e.message});
  }
  renderOverview();
  var box=document.getElementById('chat-messages');
  if(box)box.scrollTop=box.scrollHeight;
}

// ============================================================
// LINKEDIN
// ============================================================
function renderLinkedIn(){
  var li=STATE.li;
  var liName=(li&&li.name&&li.name!=='undefined undefined')?li.name:(li&&li.email?li.email:'Connected');
  var html='';
  if(STATE.mock.li)html+=alert_('warning','Showing demo data. Add LINKEDIN_ACCESS_TOKEN in Vercel env vars.');
  html+='<div class="grid3">';
  html+=statCard('Account',liName,'LinkedIn profile');

async function postToLinkedIn(){

}

async function doJobRoleSearch(){
  var roleEl=document.getElementById('jr-role');
  var customEl=document.getElementById('jr-custom');
  var locEl=document.getElementById('jr-location');
  var compEl=document.getElementById('jr-comptype');
  var btn=document.getElementById('jr-btn');
  var err=document.getElementById('jr-error');
  var role=roleEl&&roleEl.value==='custom'?(customEl?customEl.value.trim():''):( roleEl?roleEl.value:'Chief Compliance Officer');
  var location=locEl?locEl.value:'United Kingdom';
  var compType=compEl?compEl.value:'Pharmaceutical';
  if(!role){if(err)err.innerHTML=alert_('error','Please enter a job role.');return;}
  JOBROLE_STATE.loading=true;JOBROLE_STATE.results=[];JOBROLE_STATE.err='';JOBROLE_STATE.domainsFound=[];
  if(btn)btn.textContent='Searching...';
  if(err)err.innerHTML='';
  renderHunter();

  // Step 1: AI identifies companies with this role in this location
  var prompt=[
    'List 10 real '+compType+' companies in '+location+' that likely have a '+role+'.',
    'Return ONLY a JSON array of objects with company name and website domain.',
    'Format: [{"company":"Pfizer UK","domain":"pfizer.com"},{"company":"AstraZeneca","domain":"astrazeneca.com"}]',
    'Include only real, verifiable companies. Return exactly 10.'
  ].join(' ');

  var domains=[];
  try{
    var raw=await aiCall([{role:'user',content:prompt}],'You are a pharma industry expert. List real companies accurately. Return only valid JSON.');
    var companies=JSON.parse(raw.replace(/```json|```/g,'').trim());
    domains=companies.map(function(c){return {domain:c.domain,company:c.company};});
    JOBROLE_STATE.domainsFound=domains;
  }catch(e){
    JOBROLE_STATE.loading=false;JOBROLE_STATE.err='AI error: '+e.message;
    if(btn)btn.textContent='Search Contacts';
    renderHunter();
    return;
  }

  // Step 2: Search Hunter for each domain
  var allEmails=[];
  for(var i=0;i<domains.length;i++){
    var dom=domains[i];
    var data=await apiGet('/api/hunter?action=domain-search&domain='+encodeURIComponent(dom.domain));
    if(data.emails&&data.emails.length){
      data.emails.forEach(function(e){
        allEmails.push({
          name:e.name||'Unknown',
          email:e.email,
          confidence:e.confidence,
          role:e.role||'',
          company:dom.company,
          domain:dom.domain
        });
      });
    }
  }

  JOBROLE_STATE.results=allEmails;
  JOBROLE_STATE.loading=false;
  if(btn)btn.textContent='Search Contacts';
  renderHunter();
}

function renderEmailBody(text){
  if(!text)return '';
  return text.split('\n').map(function(line){
    if(!line.trim())return '<div style="height:12px;"></div>';
    var parts=line.split(/\*\*([^*]+)\*\*/g);
    var rendered=parts.map(function(p,j){return j%2===1?'<strong style="color:#1C2B1D;font-weight:700;">'+esc(p)+'</strong>':esc(p);}).join('');
    var isHead=line.startsWith('**')&&line.endsWith('**');
    return '<p style="margin:'+(isHead?'18px 0 6px':'0 0 10px')+';font-size:'+(isHead?'15':'14')+'px;line-height:1.7;color:#2C2C2C;">'+rendered+'</p>';
  }).join('');
}

function toggleEdit(){
  var disp=document.getElementById('email-body-display');
  var edit=document.getElementById('email-body-edit');
  var btn=document.getElementById('edit-toggle');
  if(!disp||!edit)return;
  if(edit.style.display==='none'){edit.style.display='block';disp.style.display='none';if(btn)btn.textContent='Done editing';}
  else{
    STATE.draft=edit.value;
    var m=STATE.draft.match(/SUBJECT:\s*(.+)/);
    if(m)STATE.draftSubj=m[1].trim();
    edit.style.display='none';disp.style.display='block';
    disp.innerHTML=renderEmailBody(edit.value);
    if(btn)btn.textContent='Edit';
  }
}

  }
}

function copyInsight(){

    if(btn){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy';},2000);}

}

function shareToLinkedIn(){

  showTab('linkedin');
  setTimeout(function(){

function getScheduledPosts(){return lsGet('li-scheduled-posts',[]);}
function saveScheduledPosts(posts){lsSet('li-scheduled-posts',posts);}

function getPostsForDate(dateStr){
  return getScheduledPosts().filter(function(p){return p.date===dateStr;});
}

function dateStr(d){
  return d.getFullYear()+'-'+(String(d.getMonth()+1).padStart(2,'0'))+'-'+(String(d.getDate()).padStart(2,'0'));
}

function fmtShort(d){
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}

// Auto-generate recurring posts based on the weekly strategy
function autoGenerateMonth(year,month){
  var posts=getScheduledPosts();
  var existing=posts.map(function(p){return p.date;});
  var d=new Date(year,month,1);
  var newPosts=[];
  while(d.getMonth()===month){
    var dow=d.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
    var type=null;
    if(dow===1)type=CONTENT_TYPES[0]; // Mon = regulatory
    else if(dow===3)type=CONTENT_TYPES[1]; // Wed = video
    else if(dow===4)type=CONTENT_TYPES[2]; // Thu = engagement
    else if(dow===5)type=CONTENT_TYPES[3]; // Fri = newsletter
    if(type){
      var ds=dateStr(d);
      if(existing.indexOf(ds)<0){
        newPosts.push({id:Date.now()+Math.random(),date:ds,type:type.id,title:type.label,notes:'',status:'planned',color:type.color});
        existing.push(ds);
      }
    }
    d.setDate(d.getDate()+1);
  }
  if(newPosts.length){
    saveScheduledPosts(posts.concat(newPosts));
  }
  return newPosts.length;
}

  html+='<button onclick="liCalNav(-1)" style="background:none;border:1px solid #E2E8E2;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;font-family:inherit;">&#8592;</button>';
  html+='<span style="font-weight:600;font-size:14px;min-width:140px;text-align:center;">'+LI_CAL.currentDate.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</span>';
  html+='<button onclick="liCalNav(1)" style="background:none;border:1px solid #E2E8E2;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;font-family:inherit;">&#8594;</button>';
  html+='<button onclick="liCalToday()" style="background:none;border:1px solid #E2E8E2;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:inherit;">Today</button>';
  html+='<button onclick="liCalAutoGen()" class="btn btn-primary" style="font-size:12px;padding:5px 12px;">Auto-fill month</button>';
  html+='<button onclick="liCalClearMonth()" style="background:none;border:1px solid #FEE2E2;color:#DC2626;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;font-family:inherit;">Clear month</button>';
  html+='</div></div>';

  // Legend
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">';
  CONTENT_TYPES.forEach(function(t){
    html+='<span style="font-size:11px;font-weight:600;background:'+t.color+'15;color:'+t.color+';border-radius:4px;padding:2px 8px;border:1px solid '+t.color+'30;">'+t.label+'</span>';
  });
  html+='</div>';

  // Calendar grid
  var year=LI_CAL.currentDate.getFullYear();
  var month=LI_CAL.currentDate.getMonth();
  var firstDay=new Date(year,month,1);
  var lastDay=new Date(year,month+1,0);
  var startDow=firstDay.getDay()||7; // 1=Mon...7=Sun

  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">';
  // Day headers
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){
    html+='<div style="text-align:center;font-size:11px;font-weight:700;color:#5C6B5D;padding:4px 0;text-transform:uppercase;letter-spacing:0.05em;">'+d+'</div>';
  });

  // Empty cells before month start
  for(var blank=1;blank<startDow;blank++){
    html+='<div style="height:80px;background:#F9FAF9;border-radius:6px;"></div>';
  }

  var today=dateStr(new Date());
  // Day cells
  for(var day=1;day<=lastDay.getDate();day++){
    var d=new Date(year,month,day);
    var ds=dateStr(d);
    var posts=getPostsForDate(ds);
    var isToday=ds===today;
    var isSel=LI_CAL.selectedDate===ds;
    html+='<div data-date="'+ds+'" onclick="liCalSelectDate(this.dataset.date)" style="min-height:80px;border-radius:6px;padding:4px;cursor:pointer;border:1.5px solid '+(isToday?'#3d8b40':isSel?'#E8651A':'#E2E8E2')+';background:'+(isToday?'#EBF5EC':isSel?'#FEF0E8':'#fff')+';position:relative;">';
    html+='<div style="font-size:11px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'#3d8b40':'#1C2B1D')+';margin-bottom:3px;">'+day+'</div>';
    posts.slice(0,3).forEach(function(p){
      var statusOp=p.status==='posted'?'1':'0.85';
      html+='<div style="font-size:9px;font-weight:600;background:'+p.color+';color:#fff;border-radius:3px;padding:1px 4px;margin-bottom:2px;opacity:'+statusOp+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">';
      html+=(p.status==='posted'?'&#10003; ':'')+esc(p.title)+'</div>';
    });
    if(posts.length>3)html+='<div style="font-size:9px;color:#5C6B5D;">+'+( posts.length-3)+' more</div>';
    html+='</div>';
  }
  html+='</div></div>';

  // Selected date detail panel
  if(LI_CAL.selectedDate){
    var selPosts=getPostsForDate(LI_CAL.selectedDate);
    var selD=new Date(LI_CAL.selectedDate+'T12:00:00');
    html+='<div class="card" style="margin-top:12px;">';
    html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">';
    html+='<div style="font-weight:700;font-size:14px;">'+fmtShort(selD)+'</div>';
    html+='<button onclick="liCalAddPost()" class="btn btn-primary" style="font-size:12px;padding:5px 14px;">+ Add post</button></div>';

    if(selPosts.length===0){
      html+='<div style="color:#5C6B5D;font-size:13px;padding:10px 0;">No posts scheduled. Click + Add post to plan content for this day.</div>';
    }

    selPosts.forEach(function(p,pi){
      var ct=CONTENT_TYPES.find(function(t){return t.id===p.type;})||CONTENT_TYPES[5];
      html+='<div style="border:1px solid '+p.color+'30;border-radius:10px;padding:12px;margin-bottom:10px;background:'+p.color+'08;">';
      html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
      html+='<div style="display:flex;align-items:center;gap:8px;">';
      html+='<span style="font-size:16px;">'+ct.icon+'</span>';
      html+='<select data-pid="'+esc(p.id)+'" data-field="type" onchange="updatePostField(this.dataset.pid,this.dataset.field,this.value)" style="font-size:12px;font-weight:600;border:none;background:transparent;color:'+p.color+';font-family:inherit;cursor:pointer;">';
      CONTENT_TYPES.forEach(function(t){html+='<option value="'+t.id+'"'+(p.type===t.id?' selected':'')+'>'+t.label+'</option>';});
      html+='</select></div>';
      html+='<div style="display:flex;gap:6px;">';
      html+='<select data-pid="'+esc(p.id)+'" data-field="status" onchange="updatePostField(this.dataset.pid,this.dataset.field,this.value);renderLiCalendar()" style="font-size:11px;border:1px solid #E2E8E2;border-radius:6px;padding:3px 6px;font-family:inherit;background:#fff;">';
      ['planned','drafted','scheduled','posted'].forEach(function(s){html+='<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>';});
      html+='</select>';
      html+='<button data-pid="'+esc(p.id)+'" onclick="deleteCalPost(this.dataset.pid)" style="background:none;border:1px solid #FEE2E2;color:#DC2626;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit;">Delete</button></div></div>';
      html+='<input data-pid="'+esc(p.id)+'" data-field="title" value="'+esc(p.title)+'" onblur="updatePostField(this.dataset.pid,this.dataset.field,this.value)" placeholder="Post title..." style="width:100%;border:1px solid #E2E8E2;border-radius:6px;padding:6px 10px;font-size:13px;margin-bottom:8px;font-family:inherit;"/>';
      html+='<textarea data-pid="'+esc(p.id)+'" data-field="notes" rows="3" onblur="updatePostField(this.dataset.pid,this.dataset.field,this.value)" placeholder="Notes, key message, or draft content..." style="width:100%;border:1px solid #E2E8E2;border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;resize:vertical;">'+esc(p.notes||'')+'</textarea>';
      html+='<div style="font-size:11px;color:#5C6B5D;margin-top:4px;">'+esc(ct.desc)+'</div></div>';
    });

    // Add post form
    html+='<div id="li-add-post-form" style="display:none;border:1px solid #3d8b40;border-radius:10px;padding:12px;margin-top:10px;">';
    html+='<div style="font-weight:600;font-size:13px;margin-bottom:10px;">New post for '+fmtShort(selD)+'</div>';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">';
    html+='<div><label style="font-size:11px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:4px;">CONTENT TYPE</label>';
    html+='<select id="new-post-type" style="width:100%;font-family:inherit;">';
    CONTENT_TYPES.forEach(function(t){html+='<option value="'+t.id+'">'+t.label+'</option>';});
    html+='</select></div>';
    html+='<div><label style="font-size:11px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:4px;">TITLE</label>';
    html+='<input id="new-post-title" placeholder="e.g. PMCPA Q2 update post" style="width:100%;font-family:inherit;"/></div></div>';
    html+='<textarea id="new-post-notes" rows="2" placeholder="Notes or draft content..." style="width:100%;border:1px solid #E2E8E2;border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;margin-bottom:10px;"></textarea>';
    html+='<div style="display:flex;gap:8px;">';
    html+='<button class="btn btn-primary" onclick="saveNewPost()" style="font-size:12px;">Save Post</button>';
    html+='<button class="btn btn-secondary" onclick="liCalHideForm()" style="font-size:12px;">Cancel</button></div></div>';
    html+='</div>';
  }

  // Weekly strategy reference
  html+='<div class="card" style="margin-top:12px;">';
  html+='<div style="font-weight:700;font-size:14px;margin-bottom:12px;">Weekly Posting Template</div>';
  var tips=[
    {day:'Mon',tip:'Regulatory Insight',detail:'3-sentence take on PMCPA or ABPI development. Best time: 8-9am.',icon:'&#128203;',color:'#3d8b40'},
    {day:'Tue',tip:'Case Study / Win',detail:'Anonymised client success story or testimonial. Builds trust.',icon:'&#11088;',color:'#7C3AED'},
    {day:'Wed',tip:'Webinar Clip',detail:'Uday clips 60-90 seconds from your last webinar. 3x more reach.',icon:'&#127916;',color:'#1a5c1d'},
    {day:'Thu',tip:'Engagement Hour',detail:'15 mins replying to comments and engaging with ICP posts.',icon:'&#128172;',color:'#0E9E8E'},
    {day:'Fri',tip:'Newsletter Teaser',detail:'Preview your upcoming newsletter. Link to subscribe.',icon:'&#128231;',color:'#E8651A'}
  ];
  html+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">';
  tips.forEach(function(t){
    html+='<div style="border:1px solid '+t.color+'30;border-radius:8px;padding:10px;background:'+t.color+'08;">';
    html+='<div style="font-size:18px;margin-bottom:4px;">'+t.icon+'</div>';
    html+='<div style="font-size:10px;font-weight:700;color:'+t.color+';text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;">'+t.day+'</div>';
    html+='<div style="font-size:12px;font-weight:600;margin-bottom:3px;">'+t.tip+'</div>';
    html+='<div style="font-size:11px;color:#5C6B5D;line-height:1.4;">'+t.detail+'</div></div>';
  });
  html+='</div></div>';

  el.innerHTML=html;
}

function liCalNav(dir){
  LI_CAL.currentDate=new Date(LI_CAL.currentDate.getFullYear(),LI_CAL.currentDate.getMonth()+dir,1);
  LI_CAL.selectedDate=null;
  renderLiCalendar();
}
function liCalToday(){LI_CAL.currentDate=new Date();LI_CAL.selectedDate=dateStr(new Date());renderLiCalendar();}
function liCalSelectDate(ds){LI_CAL.selectedDate=(LI_CAL.selectedDate===ds?null:ds);renderLiCalendar();}

function liCalAutoGen(){
  var y=LI_CAL.currentDate.getFullYear();
  var m=LI_CAL.currentDate.getMonth();
  var n=autoGenerateMonth(y,m);
  alert(n>0?'Added '+n+' scheduled posts for this month based on your weekly strategy.':'This month already has posts scheduled for all strategy days.');
  renderLiCalendar();
}

function liCalClearMonth(){
  if(!confirm('Clear all planned posts for this month?'))return;
  var y=LI_CAL.currentDate.getFullYear();
  var m=LI_CAL.currentDate.getMonth();
  var posts=getScheduledPosts().filter(function(p){
    var d=new Date(p.date);
    return !(d.getFullYear()===y&&d.getMonth()===m);
  });
  saveScheduledPosts(posts);
  renderLiCalendar();
}

function liCalAddPost(){
  var f=document.getElementById('li-add-post-form');
  if(f)f.style.display=f.style.display==='none'?'block':'none';
}

function liCalHideForm(){var f=document.getElementById('li-add-post-form');if(f)f.style.display='none';}
function saveNewPost(){
  var type=document.getElementById('new-post-type');
  var title=document.getElementById('new-post-title');
  var notes=document.getElementById('new-post-notes');
  var ct=CONTENT_TYPES.find(function(t){return t.id===(type?type.value:'custom');})||CONTENT_TYPES[5];
  var posts=getScheduledPosts();
  posts.push({
    id:String(Date.now()),
    date:LI_CAL.selectedDate,
    type:ct.id,
    title:title&&title.value?title.value:ct.label,
    notes:notes?notes.value:'',
    status:'planned',
    color:ct.color
  });
  saveScheduledPosts(posts);
  renderLiCalendar();
}

function updatePostField(pid,field,value){
  var posts=getScheduledPosts();
  var p=posts.find(function(x){return x.id===pid;});
  if(p){
    p[field]=value;
    if(field==='type'){
      var ct=CONTENT_TYPES.find(function(t){return t.id===value;})||CONTENT_TYPES[5];
      p.color=ct.color;
      if(!p.title||p.title===p.type)p.title=ct.label;
    }
    saveScheduledPosts(posts);
  }
  if(field==='status')renderLiCalendar();
}

function deleteCalPost(pid){
  if(!confirm('Delete this post?'))return;
  saveScheduledPosts(getScheduledPosts().filter(function(p){return p.id!==pid;}));
  renderLiCalendar();
}
// ============================================================
// INIT
// ============================================================
loadAll();
</script>
