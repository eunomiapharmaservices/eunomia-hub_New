<meta charset="UTF-8"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#F4F7F4;color:#1C2B1D;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{background:#fff;border:1px solid #E2E8E2;border-radius:14px;padding:20px;animation:up 0.2s ease;}
.tab{background:none;border:none;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:#5C6B5D;transition:all .15s;}
.tab.on{color:#3d8b40;border-bottom-color:#3d8b40;}
.tab:hover:not(.on){color:#1C2B1D;}
.tc{border:1.5px solid #E2E8E2;border-radius:10px;padding:14px;cursor:pointer;background:#fff;transition:all .15s;}
.tc.sel{border-color:#3d8b40;background:#EBF5EC;}
.tc:hover:not(.sel){border-color:#3d8b4060;}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E2E8E2;font-size:13px;}
.row:last-child{border-bottom:none;}
.cu{background:#3d8b40;color:#fff;border-radius:12px 12px 2px 12px;padding:10px 14px;font-size:13px;max-width:80%;margin-left:auto;}
.ca{background:#F3F4F6;color:#1C2B1D;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:13px;max-width:85%;white-space:pre-wrap;line-height:1.6;}
input,button,textarea,select{font-family:inherit;}
</style>
<script>
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#DC2626;"><strong>JavaScript error:</strong><br>' + msg + '<br><small>Line ' + line + ' in ' + src + '</small></div>';
};
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#DC2626;"><strong>Promise error:</strong><br>' + e.reason + '</div>';
});
</script>
</head>
<body>
<div id="root"><div style="padding:40px;font-family:sans-serif;color:#5C6B5D;display:flex;align-items:center;gap:12px;"><span style="width:20px;height:20px;border:3px solid #3d8b4030;border-top-color:#3d8b40;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;"></span> Loading Eunomia Marketing Hub...</div></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const C={
  navy:'#2C3E2D',blue:'#3d8b40',blueL:'#EBF5EC',
  teal:'#0E9E8E',amber:'#E8651A',amberL:'#FEF0E8',
  red:'#DC2626',redL:'#FEE2E2',green:'#3d8b40',greenL:'#EBF5EC',
  gray:'#6B7280',grayL:'#F5F6F5',border:'#E2E8E2',
  text:'#1C2B1D',muted:'#5C6B5D',white:'#FFFFFF'
};

function Spin({s}){
  const sz=s||16;
  return <span style={{display:'inline-block',width:sz,height:sz,border:'2px solid #3d8b4030',borderTopColor:'#3d8b40',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>;
}
function Pill({label,color}){
  return <span style={{fontSize:11,fontWeight:600,background:color+'18',color:color,borderRadius:20,padding:'2px 9px',whiteSpace:'nowrap'}}>{label}</span>;
}
function Stat({label,value,sub,color}){
  return(
    <div style={{background:'#fff',border:'1px solid #E2E8E2',borderRadius:12,padding:'16px 18px'}}>
      <div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>{label}</div>
      <div style={{fontSize:26,fontWeight:700,color:C.text,lineHeight:1.1}}>{value||'-'}</div>
      {sub ? <div style={{fontSize:12,color:C.muted,marginTop:4}}>{sub}</div> : null}
    </div>
  );
}
function Alert({type,children}){
  const colors={info:['#EBF5EC','#3d8b40'],warning:['#FEF0E8','#E8651A'],error:['#FEE2E2','#DC2626'],success:['#EBF5EC','#3d8b40']};
  const t=type||'info';
  const bg=colors[t][0],fg=colors[t][1];
  return <div style={{background:bg,border:'1px solid '+fg+'30',borderRadius:10,padding:'10px 14px',fontSize:13,marginBottom:10}}>{children}</div>;
}
function SH({children}){
  return <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:14}}>{children}</div>;
}

const daysSince=function(iso){return Math.floor((Date.now()-new Date(iso))/86400000);};
const nextDue=function(iso){var d=new Date(iso);d.setDate(d.getDate()+30);return d;};
const daysUntil=function(iso){return Math.max(0,Math.ceil((nextDue(iso)-Date.now())/86400000));};
const fmtDate=function(iso){return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});};
const tagColor={PMCPA:'#3d8b40',ABPI:'#1a5c1d',ANSM:'#0E9E8E',FCPA:'#E8651A',Digital:'#3d8b40',Training:'#7C3AED',Strategy:'#DC2626'};

async function callClaude(messages,system,onChunk){
  var resp;
  try{
    resp=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages,system:system})});
  }catch(e){throw new Error('Could not reach /api/claude');}
  if(!resp.ok){
    var msg='AI error ('+resp.status+')';
    try{var ej=await resp.json();msg=ej.error||msg;}catch(x){}
    throw new Error(msg);
  }
  var reader=resp.body.getReader();
  var dec=new TextDecoder();
  var full='';
  while(true){
    var rv=await reader.read();
    if(rv.done)break;
    var lines=dec.decode(rv.value,{stream:true}).split('\n');
    for(var i=0;i<lines.length;i++){
      if(lines[i].startsWith('data: ')){
        try{
          var j=JSON.parse(lines[i].slice(6));
          if(j.type==='content_block_delta'&&j.delta&&j.delta.text){full+=j.delta.text;onChunk(full);}
        }catch(x){}
      }
    }
  }
  if(!full)throw new Error('No response received. Check ANTHROPIC_API_KEY.');
  return full;
}

async function apiGet(path){try{var r=await fetch(path);return await r.json();}catch(e){return{error:e.message};}}
async function apiPost(path,body){try{var r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}catch(e){return{error:e.message};}}

var MOCK={
  mc:{subscribers:834,openRate:'31.4',lastSent:new Date(Date.now()-25*86400000).toISOString(),
    lastSubject:'PMCPA Social Media Guidance: What It Means For Your Team',
    campaigns:[
      {id:'1',name:'PMCPA Social Media Guidance Alert',date:'08/04/2025',sent:834,opens:'34.2%',clicks:'5.1%',status:'sent'},
      {id:'2',name:'March Regulatory Roundup',date:'18/03/2025',sent:801,opens:'29.7%',clicks:'3.9%',status:'sent'},
      {id:'3',name:'ABPI Code 2024 Key Changes',date:'28/02/2025',sent:788,opens:'38.1%',clicks:'6.2%',status:'sent'}
    ]},
  ht:{creditsUsed:312,creditsTotal:500,verificationUsed:289,verificationTotal:500,plan:'Starter'},
  li:{name:'Eunomia Consulting',connections:1247,email:''},
  sr:{summary:{activeSequences:3,messagesSent:47,replies:9,replyRate:'19.1',meetings:2},
    campaigns:[
      {name:'PMCPA Social Media Update',sent:18,replies:4,rate:'22.2',status:'active'},
      {name:'ABPI Code 2024 Briefing',sent:21,replies:3,rate:'14.3',status:'active'},
      {name:'Compliance Audit Offer',sent:8,replies:2,rate:'25.0',status:'active'}
    ]}
};

// -- Hunter Tab ---------------------------------------------------------------
function HunterTab(props){
  var ht=props.ht,usingMock=props.usingMock;
  var [domain,setDomain]=useState('');
  var [searching,setSearching]=useState(false);
  var [results,setResults]=useState(null);
  var [err,setErr]=useState('');
  var [selected,setSelected]=useState([]);
  var [exporting,setExporting]=useState(false);
  var [exportResult,setExportResult]=useState(null);
  var [verifying,setVerifying]=useState(false);
  var [activeView,setActiveView]=useState('search');
  var [leads,setLeads]=useState(null);
  var [leadsLoading,setLeadsLoading]=useState(false);
  var [leadsErr,setLeadsErr]=useState('');
  var [leadsSelected,setLeadsSelected]=useState([]);
  var [leadsExporting,setLeadsExporting]=useState(false);
  var [leadsExportResult,setLeadsExportResult]=useState(null);
  var [hubspotExporting,setHubspotExporting]=useState(false);
  var [hubspotResult,setHubspotResult]=useState(null);

  async function doSearch(){
    var raw=domain.trim();
    if(!raw)return;
    if(raw.indexOf(' ')>=0||raw.indexOf('.')<0){
      setErr('Please enter a domain name (e.g. pfizer.com) not a company name. Hunter.io requires a website domain.');
      return;
    }
    setSearching(true);setResults(null);setErr('');setSelected([]);setExportResult(null);
    var d=raw.replace(/^https?:\/\//,'').replace(/\/.*/,'').toLowerCase();
    var data=await apiGet('/api/hunter?action=domain-search&domain='+encodeURIComponent(d));
    if(data.error){setErr(data.error);}else{setResults(data);}
    setSearching(false);
  }

  async function verifySelected(){
    if(!selected.length)return;
    setVerifying(true);
    var updated={emails:results.emails.slice(),domain:results.domain,total:results.total};
    for(var i=0;i<selected.length;i++){
      var email=selected[i];
      var d=await apiGet('/api/hunter?action=verify&email='+encodeURIComponent(email));
      updated.emails=updated.emails.map(function(e){return e.email===email?Object.assign({},e,{verified:d.status,score:d.score}):e;});
    }
    setResults(updated);
    setVerifying(false);
  }

  async function exportToMailchimp(){
    if(!selected.length)return;
    setExporting(true);setExportResult(null);
    var members=results.emails.filter(function(e){return selected.indexOf(e.email)>=0;});
    var data=await apiPost('/api/mailchimp?action=add-members',{members:members,tag:'ABM-Hunter'});
    setExportResult(data);
    setExporting(false);
  }

  function toggleAll(){
    if(selected.length===results.emails.length)setSelected([]);
    else setSelected(results.emails.map(function(e){return e.email;}));
  }

  function csvDownload(){
    if(!results||!results.emails.length)return;
    var chosen=results.emails.filter(function(e){return selected.indexOf(e.email)>=0;});
    var rows=[['Name','Email','Role','Confidence']].concat(chosen.map(function(e){return [e.name,e.email,e.role||'',e.confidence];}));
    var csv=rows.map(function(r){return r.map(function(v){return '"'+v+'"';}).join(',');}).join('\n');
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='hunter-'+(results.domain||'results')+'.csv';a.click();
  }

  function toggleEmail(email){
    setSelected(function(p){
      if(p.indexOf(email)>=0)return p.filter(function(x){return x!==email;});
      return p.concat([email]);
    });
  }

  async function loadLeads(){
    setLeadsLoading(true);setLeads(null);setLeadsErr('');setLeadsSelected([]);setLeadsExportResult(null);setHubspotResult(null);
    var data=await apiGet('/api/hunter?action=leads&limit=100');
    if(data.error){setLeadsErr(data.error);}
    else{setLeads(data);}
    setLeadsLoading(false);
  }

  function toggleLead(email){
    setLeadsSelected(function(p){
      if(p.indexOf(email)>=0)return p.filter(function(x){return x!==email;});
      return p.concat([email]);
    });
  }

  function toggleAllLeads(){
    if(!leads||!leads.leads)return;
    if(leadsSelected.length===leads.leads.length)setLeadsSelected([]);
    else setLeadsSelected(leads.leads.map(function(l){return l.email;}).filter(Boolean));
  }

  function csvDownloadLeads(){
    if(!leads||!leads.leads)return;
    var chosen=leadsSelected.length>0
      ?leads.leads.filter(function(l){return leadsSelected.indexOf(l.email)>=0;})
      :leads.leads;
    var rows=[['First Name','Last Name','Email','Company','Position','Phone','LinkedIn']].concat(
      chosen.map(function(l){return [l.firstName,l.lastName,l.email,l.company,l.position,l.phone,l.linkedinUrl];})
    );
    var csv=rows.map(function(r){return r.map(function(v){return String.fromCharCode(34)+(v||'')+String.fromCharCode(34);}).join(',');}).join('
');
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='hunter-leads-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  }

  async function exportLeadsToMailchimp(){
    var chosen=leadsSelected.length>0
      ?leads.leads.filter(function(l){return leadsSelected.indexOf(l.email)>=0&&l.email;})
      :leads.leads.filter(function(l){return l.email;});
    if(!chosen.length){setLeadsExportResult({error:'No contacts with email addresses selected'});return;}
    setLeadsExporting(true);setLeadsExportResult(null);
    var members=chosen.map(function(l){return {name:l.name,email:l.email,role:l.position};});
    var data=await apiPost('/api/mailchimp?action=add-members',{members:members,tag:'Hunter-Leads'});
    setLeadsExportResult(data);
    setLeadsExporting(false);
  }

  async function exportLeadsToHubspot(){
    var chosen=leadsSelected.length>0
      ?leads.leads.filter(function(l){return leadsSelected.indexOf(l.email)>=0&&l.email;})
      :leads.leads.filter(function(l){return l.email;});
    if(!chosen.length){setHubspotResult({error:'No contacts with email addresses'});return;}
    setHubspotExporting(true);setHubspotResult(null);
    // HubSpot batch create contacts via their public API
    // Since we don't have HubSpot API integrated, we generate a HubSpot-ready CSV
    var rows=[['First Name','Last Name','Email Address','Company Name','Job Title','Phone Number','LinkedIn Bio']].concat(
      chosen.map(function(l){return [l.firstName,l.lastName,l.email,l.company,l.position,l.phone,l.linkedinUrl];})
    );
    var csv=rows.map(function(r){return r.map(function(v){return String.fromCharCode(34)+(v||'')+String.fromCharCode(34);}).join(',');}).join('
');
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='hubspot-import-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
    setHubspotResult({success:true,count:chosen.length});
    setHubspotExporting(false);
  }

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {usingMock ? <Alert type="warning">Showing demo data. Add HUNTER_API_KEY in Vercel env vars for live data.</Alert> : null}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        <Stat label="Plan" value={ht?ht.plan:null}/>
        <Stat label="Search credits" value={ht?ht.creditsUsed+'/'+ht.creditsTotal:null} color={ht&&ht.creditsUsed/ht.creditsTotal>0.8?C.red:C.green}/>
        <Stat label="Verifications" value={ht?ht.verificationUsed+'/'+ht.verificationTotal:null} color={C.teal}/>
        <Stat label="Credits left" value={ht?ht.creditsTotal-ht.creditsUsed:null}/>
      </div>

      {/* View toggle */}
      <div style={{display:'flex',gap:8}}>
        <button onClick={function(){setActiveView('search');}}
          style={{background:activeView==='search'?C.blue:'#fff',color:activeView==='search'?'#fff':C.muted,border:'1px solid '+(activeView==='search'?C.blue:'#E2E8E2'),borderRadius:8,padding:'8px 18px',fontSize:13,fontWeight:600,cursor:'pointer'}}>
          Domain Search
        </button>
        <button onClick={function(){setActiveView('leads');if(!leads&&!leadsLoading)loadLeads();}}
          style={{background:activeView==='leads'?C.blue:'#fff',color:activeView==='leads'?'#fff':C.muted,border:'1px solid '+(activeView==='leads'?C.blue:'#E2E8E2'),borderRadius:8,padding:'8px 18px',fontSize:13,fontWeight:600,cursor:'pointer'}}>
          My Leads {leads?' ('+leads.total+')':''}
        </button>
      </div>

      {/* Leads panel */}
      {activeView==='leads' ? (
        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <SH>All saved leads from Hunter.io</SH>
            <button onClick={loadLeads} disabled={leadsLoading}
              style={{background:'none',border:'1px solid #E2E8E2',borderRadius:7,padding:'6px 14px',fontSize:12,cursor:'pointer',color:C.muted}}>
              {leadsLoading?'Loading...':'Refresh'}
            </button>
          </div>

          {leadsLoading ? <div style={{textAlign:'center',padding:'28px 0',color:C.muted,display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><Spin/> Loading your leads...</div> : null}
          {leadsErr ? <Alert type="error">{leadsErr}</Alert> : null}

          {leads&&leads.leads ? (
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:8}}>
                <div style={{fontSize:13,color:C.muted}}>
                  <strong style={{color:C.text}}>{leads.total}</strong> leads in your Hunter account
                  {leadsSelected.length>0?' - '+leadsSelected.length+' selected':''}
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <button onClick={toggleAllLeads}
                    style={{background:'none',border:'1px solid #E2E8E2',borderRadius:7,padding:'6px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                    {leadsSelected.length===leads.leads.filter(function(l){return l.email;}).length?'Deselect all':'Select all'}
                  </button>
                </div>
              </div>

              {leads.leads.length===0 ? (
                <div style={{textAlign:'center',padding:'24px',color:C.muted,fontSize:13}}>
                  No leads saved in Hunter.io yet. Use Domain Search to find emails and save them, or add leads directly at hunter.io/leads.
                </div>
              ) : (
                <div style={{border:'1px solid #E2E8E2',borderRadius:10,overflow:'hidden',marginBottom:14}}>
                  <div style={{display:'grid',gridTemplateColumns:'36px 1fr 1fr 1fr 100px',gap:8,padding:'8px 12px',background:C.grayL,fontSize:11,fontWeight:600,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em'}}>
                    <span/><span>Name</span><span>Email</span><span>Company</span><span>Position</span>
                  </div>
                  {leads.leads.map(function(l,idx){
                    var isSel=leadsSelected.indexOf(l.email)>=0;
                    return(
                      <div key={idx} onClick={function(){if(l.email)toggleLead(l.email);}}
                        style={{display:'grid',gridTemplateColumns:'36px 1fr 1fr 1fr 100px',gap:8,padding:'10px 12px',borderTop:'1px solid #E2E8E2',cursor:l.email?'pointer':'default',background:isSel?C.blueL:'#fff'}}>
                        <div style={{width:18,height:18,borderRadius:4,border:'2px solid '+(isSel?C.blue:'#E2E8E2'),background:isSel?C.blue:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,color:'#fff'}}>
                          {isSel?'v':''}
                        </div>
                        <div style={{fontWeight:600,fontSize:13}}>{l.name||'-'}</div>
                        <span style={{fontSize:12,color:C.blue,fontFamily:'monospace',wordBreak:'break-all'}}>{l.email||'No email'}</span>
                        <span style={{fontSize:12,color:C.muted}}>{l.company||'-'}</span>
                        <span style={{fontSize:12,color:C.muted}}>{l.position?l.position.slice(0,20)+'...':'-'}</span>
                      </div>
                    );
                  })}
                </div>
              )}

              {leads.leads.length>0 ? (
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
                    <span style={{fontSize:13,color:C.muted,flex:1}}>
                      {leadsSelected.length>0?leadsSelected.length+' selected':'All '+leads.leads.filter(function(l){return l.email;}).length+' with emails will be exported'}
                    </span>
                    <button onClick={csvDownloadLeads}
                      style={{background:'#fff',border:'1px solid #E2E8E2',borderRadius:8,padding:'9px 16px',fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                      Download CSV
                    </button>
                    <button onClick={exportLeadsToMailchimp} disabled={leadsExporting}
                      style={{background:leadsExporting?C.grayL:C.amber,color:leadsExporting?C.muted:'#fff',border:'none',borderRadius:8,padding:'9px 16px',fontSize:13,fontWeight:600,cursor:leadsExporting?'default':'pointer'}}>
                      {leadsExporting?'Exporting...':'Export to Mailchimp'}
                    </button>
                    <button onClick={exportLeadsToHubspot} disabled={hubspotExporting}
                      style={{background:hubspotExporting?C.grayL:'#FF7A59',color:hubspotExporting?C.muted:'#fff',border:'none',borderRadius:8,padding:'9px 16px',fontSize:13,fontWeight:600,cursor:hubspotExporting?'default':'pointer',display:'flex',alignItems:'center',gap:6}}>
                      {hubspotExporting?'Preparing...':'Export for HubSpot'}
                    </button>
                  </div>

                  {leadsExportResult ? (
                    <Alert type={leadsExportResult.error?'error':'success'}>
                      {leadsExportResult.error?'Mailchimp error: '+leadsExportResult.error:(leadsExportResult.added||leadsSelected.length)+' contacts added to Mailchimp with tag Hunter-Leads'}
                    </Alert>
                  ) : null}

                  {hubspotResult ? (
                    <Alert type={hubspotResult.error?'error':'success'}>
                      {hubspotResult.error?hubspotResult.error:'HubSpot CSV downloaded with '+hubspotResult.count+' contacts. Now go to HubSpot -> Contacts -> Import -> Import a file, and upload the downloaded CSV.'}
                    </Alert>
                  ) : null}
                </div>
              ) : null}
            </div>
          ) : null}
        </div>
      ) : null}

      {activeView==='search' ? (
      <div className="card">
        <SH>Find emails by company domain</SH>
        <div style={{fontSize:13,color:C.muted,marginBottom:14}}>Enter a company website domain to find verified emails. Use pfizer.com not "Pfizer".</div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          <input value={domain} onChange={function(e){setDomain(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')doSearch();}}
            placeholder="e.g. pfizer.com, gsk.com, novartis.com"
            style={{flex:1,border:'1px solid #E2E8E2',borderRadius:8,padding:'10px 14px',fontSize:13,outline:'none'}}/>
          <button onClick={doSearch} disabled={searching||!domain.trim()}
            style={{background:domain.trim()?C.blue:C.grayL,color:domain.trim()?'#fff':C.muted,border:'none',borderRadius:8,padding:'10px 20px',fontSize:13,fontWeight:600,cursor:domain.trim()?'pointer':'default',display:'flex',alignItems:'center',gap:8}}>
            {searching ? <Spin s={14}/> : null}
            {searching ? 'Searching...' : 'Search'}
          </button>
        </div>

        {err ? <Alert type="error">{err}</Alert> : null}

        {results ? (
          results.emails&&results.emails.length===0 ? (
            <div style={{background:C.amberL,border:'1px solid #E8651A30',borderRadius:10,padding:'14px 18px',fontSize:13}}>
              <strong style={{color:C.amber}}>No emails found for {results.domain}</strong>
              <div style={{color:C.muted,marginTop:4,fontSize:12}}>Hunter.io may not have data for this domain. Try the main domain (e.g. gsk.com not uk.gsk.com).</div>
            </div>
          ) : results.emails&&results.emails.length>0 ? (
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                <div style={{fontSize:13,color:C.muted}}>
                  Found <strong style={{color:C.text}}>{results.emails.length}</strong> emails at <strong style={{color:C.text}}>{results.domain}</strong>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={toggleAll} style={{background:'none',border:'1px solid #E2E8E2',borderRadius:7,padding:'6px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                    {selected.length===results.emails.length ? 'Deselect all' : 'Select all'}
                  </button>
                  <button onClick={verifySelected} disabled={!selected.length||verifying}
                    style={{background:selected.length?C.teal:'#e5e7eb',color:selected.length?'#fff':C.muted,border:'none',borderRadius:7,padding:'6px 12px',fontSize:12,fontWeight:600,cursor:selected.length?'pointer':'default'}}>
                    {verifying ? 'Verifying...' : 'Verify selected'}
                  </button>
                </div>
              </div>

              <div style={{border:'1px solid #E2E8E2',borderRadius:10,overflow:'hidden',marginBottom:14}}>
                <div style={{display:'grid',gridTemplateColumns:'36px 1fr 1fr 100px 80px',gap:8,padding:'8px 12px',background:C.grayL,fontSize:11,fontWeight:600,color:C.muted,textTransform:'uppercase',letterSpacing:'0.05em'}}>
                  <span/><span>Name</span><span>Email</span><span>Role</span><span style={{textAlign:'right'}}>Confidence</span>
                </div>
                {results.emails.map(function(e,idx){
                  var isSel=selected.indexOf(e.email)>=0;
                  return(
                    <div key={idx} onClick={function(){toggleEmail(e.email);}}
                      style={{display:'grid',gridTemplateColumns:'36px 1fr 1fr 100px 80px',gap:8,padding:'10px 12px',borderTop:'1px solid #E2E8E2',cursor:'pointer',background:isSel?C.blueL:'#fff'}}>
                      <div style={{width:18,height:18,borderRadius:4,border:'2px solid '+(isSel?C.blue:'#E2E8E2'),background:isSel?C.blue:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,color:'#fff'}}>
                        {isSel?'v':''}
                      </div>
                      <div>
                        <div style={{fontWeight:600,fontSize:13}}>{e.name}</div>
                        {e.verified ? <span style={{fontSize:10,background:e.verified==='valid'?C.greenL:C.amberL,color:e.verified==='valid'?C.green:C.amber,borderRadius:4,padding:'1px 5px',fontWeight:600}}>{e.verified}</span> : null}
                      </div>
                      <span style={{fontSize:12,color:C.blue,fontFamily:'monospace',wordBreak:'break-all'}}>{e.email}</span>
                      <span style={{fontSize:12,color:C.muted}}>{e.role||'-'}</span>
                      <div style={{textAlign:'right'}}>
                        <Pill label={e.confidence+'%'} color={e.confidence>=90?C.green:e.confidence>=75?C.amber:C.red}/>
                      </div>
                    </div>
                  );
                })}
              </div>

              {selected.length>0 ? (
                <div style={{display:'flex',gap:10,alignItems:'center',padding:'12px 14px',background:C.blueL,borderRadius:10}}>
                  <span style={{fontSize:13,fontWeight:600,flex:1}}>{selected.length} email{selected.length!==1?'s':''} selected</span>
                  <button onClick={csvDownload} style={{background:'#fff',border:'1px solid #E2E8E2',borderRadius:8,padding:'8px 14px',fontSize:13,fontWeight:600,cursor:'pointer'}}>
                    Download CSV
                  </button>
                  <button onClick={exportToMailchimp} disabled={exporting}
                    style={{background:exporting?C.grayL:C.amber,color:exporting?C.muted:'#fff',border:'none',borderRadius:8,padding:'8px 16px',fontSize:13,fontWeight:600,cursor:exporting?'default':'pointer'}}>
                    {exporting ? 'Exporting...' : 'Export to Mailchimp'}
                  </button>
                </div>
              ) : null}

              {exportResult ? (
                <div style={{marginTop:10}}>
                  <Alert type={exportResult.error?'error':'success'}>
                    {exportResult.error ? 'Mailchimp error: '+exportResult.error : (exportResult.added||selected.length)+' contacts added to Mailchimp with tag ABM-Hunter'}
                  </Alert>
                </div>
              ) : null}
            </div>
          ) : null
        ) : null}
      </div>
      ) : null}
    </div>
  );
}

// -- LinkedIn Composer --------------------------------------------------------
function LinkedInComposer(props){
  var li=props.li;
  var [text,setText]=useState('');
  var [postAs,setPostAs]=useState('person');
  var [posting,setPosting]=useState(false);
  var [result,setResult]=useState(null);
  var [aiLoading,setAiLoading]=useState(false);
  var maxChars=3000;

  async function generateDraft(){
    setAiLoading(true);
    try{
      await callClaude(
        [{role:'user',content:'Write a LinkedIn post for Eunomia Pharma Services, a UK pharma compliance consultancy. Topic: a current pharma regulatory update (PMCPA, ABPI Code 2024, or compliance best practice). 150-200 words. 3-4 relevant hashtags at the end. No emojis. Ready to post immediately.'}],
        'You are a LinkedIn content expert for pharma compliance. Write posts that position Eunomia as a thought leader. Be direct and insightful.',
        function(chunk){setText(chunk);}
      );
    }catch(e){setText('Error: '+e.message);}
    setAiLoading(false);
  }

  async function doPost(){
    if(!text.trim())return;
    setPosting(true);setResult(null);
    var data=await apiPost('/api/linkedin?action=post',{text:text,postAs:postAs});
    setResult(data);
    if(data.success)setText('');
    setPosting(false);
  }

  return(
    <div className="card" style={{border:'1.5px solid #3d8b40'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:15}}>Create LinkedIn Post</div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:12,color:C.muted}}>Post as:</span>
          <select value={postAs} onChange={function(e){setPostAs(e.target.value);}}
            style={{fontSize:12,border:'1px solid #E2E8E2',borderRadius:6,padding:'4px 8px',background:'#fff'}}>
            <option value="person">Personal profile ({li?li.name:'You'})</option>
            <option value="org">Eunomia company page</option>
          </select>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <button onClick={generateDraft} disabled={aiLoading}
          style={{background:aiLoading?C.grayL:C.blueL,color:aiLoading?C.muted:C.blue,border:'1px solid #3d8b4040',borderRadius:7,padding:'7px 14px',fontSize:12,fontWeight:600,cursor:aiLoading?'default':'pointer',display:'flex',alignItems:'center',gap:6}}>
          {aiLoading ? <Spin s={13}/> : null}
          {aiLoading ? 'Writing draft...' : 'Generate AI draft'}
        </button>
        {text ? <button onClick={function(){setText('');}} style={{background:'none',border:'1px solid #E2E8E2',borderRadius:7,padding:'7px 12px',fontSize:12,cursor:'pointer',color:C.muted}}>Clear</button> : null}
      </div>

      <textarea value={text} onChange={function(e){setText(e.target.value.slice(0,maxChars));}}
        placeholder="Write your post here, or generate an AI draft above..."
        rows={8}
        style={{width:'100%',border:'1px solid #E2E8E2',borderRadius:10,padding:'12px 14px',fontSize:13,lineHeight:1.7,resize:'vertical',outline:'none',color:C.text}}/>
      <div style={{fontSize:12,color:text.length>2800?C.red:text.length>2500?C.amber:C.muted,marginTop:6,marginBottom:14}}>
        {text.length}/{maxChars} characters
      </div>

      {result ? (
        result.success ? (
          <div style={{background:C.greenL,border:'1px solid #3d8b4030',borderRadius:8,padding:'10px 14px',fontSize:13,marginBottom:12}}>
            Posted successfully!
            <a href="https://www.linkedin.com/feed/" target="_blank" rel="noreferrer" style={{color:C.blue,fontWeight:600,marginLeft:8}}>View feed</a>
          </div>
        ) : (
          <Alert type="error">
            <strong>Could not post: </strong>{result.error}
            {result.error==='Permission denied' ? <div style={{marginTop:8,fontSize:12}}>Add w_member_social scope to your LinkedIn token and update LINKEDIN_ACCESS_TOKEN in Vercel.</div> : null}
          </Alert>
        )
      ) : null}

      <button onClick={doPost} disabled={posting||!text.trim()}
        style={{background:text.trim()&&!posting?C.blue:C.grayL,color:text.trim()&&!posting?'#fff':C.muted,border:'none',borderRadius:9,padding:'11px 24px',fontSize:14,fontWeight:700,cursor:text.trim()&&!posting?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%'}}>
        {posting ? <Spin s={16}/> : null}
        {posting ? 'Posting to LinkedIn...' : 'Post to LinkedIn'}
      </button>
    </div>
  );
}
