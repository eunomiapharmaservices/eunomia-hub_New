<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Eunomia Marketing Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F4F7F4;color:#1C2B1D;font-size:14px;}
.topbar{background:#2C3E2D;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;border-bottom:2px solid #E8651A;position:sticky;top:0;z-index:100;}
.logo-text{color:#fff;font-weight:700;font-size:14px;letter-spacing:0.02em;}
.logo-sub{color:#a8c5a9;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;}
.status-dot{font-size:11px;border-radius:5px;padding:3px 8px;font-weight:600;margin-left:4px;}
.status-live{background:#3d8b4025;color:#5db860;border:1px solid #3d8b4050;}
.status-demo{background:#E8651A25;color:#E8651A;border:1px solid #E8651A50;}
.status-loading{background:#ffffff20;color:#a8c5a9;}
.tabs{border-bottom:1px solid #E2E8E2;background:#fff;padding:0 24px;display:flex;overflow-x:auto;}
.tab{background:none;border:none;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:#5C6B5D;white-space:nowrap;}
.tab.active{color:#3d8b40;border-bottom-color:#3d8b40;}
.content{padding:24px;max-width:960px;margin:0 auto;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.stat{background:#fff;border:1px solid #E2E8E2;border-radius:12px;padding:16px 18px;}
.stat-label{font-size:11px;font-weight:600;color:#5C6B5D;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.stat-value{font-size:26px;font-weight:700;color:#1C2B1D;line-height:1.1;}
.stat-sub{font-size:12px;color:#5C6B5D;margin-top:4px;}
.card{background:#fff;border:1px solid #E2E8E2;border-radius:14px;padding:20px;margin-bottom:16px;}
.card-title{font-size:15px;font-weight:700;color:#1C2B1D;margin-bottom:14px;}
.btn{border:none;border-radius:8px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:#3d8b40;color:#fff;}
.btn-primary:hover{background:#2d6b30;}
.btn-primary:disabled{background:#E2E8E2;color:#9CA3AF;cursor:default;}
.btn-secondary{background:#fff;border:1px solid #E2E8E2;color:#5C6B5D;}
.btn-amber{background:#E8651A;color:#fff;}
.btn-orange{background:#FF7A59;color:#fff;}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E2E8E2;font-size:13px;}
.row:last-child{border-bottom:none;}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;}
.alert{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:10px;}
.alert-warning{background:#FEF0E8;border:1px solid #E8651A30;}
.alert-error{background:#FEE2E2;border:1px solid #DC262630;}
.alert-success{background:#EBF5EC;border:1px solid #3d8b4030;}
.alert-info{background:#EBF5EC;border:1px solid #3d8b4040;}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid #E2E8E2;border-radius:8px;padding:9px 12px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:#3d8b40;}
.banner{border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.chat-box{background:#F5F6F5;border-radius:10px;padding:12px;min-height:200px;max-height:280px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.chat-user{background:#3d8b40;color:#fff;border-radius:12px 12px 2px 12px;padding:10px 14px;font-size:13px;max-width:80%;margin-left:auto;word-break:break-word;}
.chat-ai{background:#E5E7EB;color:#1C2B1D;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:13px;max-width:85%;white-space:pre-wrap;line-height:1.6;word-break:break-word;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #3d8b4030;border-top-color:#3d8b40;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.seq-grid{display:grid;grid-template-columns:1fr 90px 70px 80px 90px;gap:8px;align-items:center;}
.hunter-grid{display:grid;grid-template-columns:36px 1fr 1fr 100px 80px;gap:8px;align-items:center;}
.tbl-hdr{font-size:11px;font-weight:600;color:#5C6B5D;text-transform:uppercase;letter-spacing:0.05em;padding:8px 12px;background:#F5F6F5;}
.tbl-row{padding:10px 12px;border-top:1px solid #E2E8E2;cursor:pointer;}
.tbl-row:hover{background:#F9FAFB;}
.tbl-row.selected{background:#EBF5EC;}
.check{width:18px;height:18px;border-radius:4px;border:2px solid #E2E8E2;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.check.on{background:#3d8b40;border-color:#3d8b40;color:#fff;}
.msg-card{border:1px solid #E2E8E2;border-radius:10px;overflow:hidden;margin-bottom:12px;}
.msg-hdr{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;}
.msg-body{padding:14px 16px;font-size:13px;line-height:1.7;white-space:pre-wrap;}
.email-preview{border:1px solid #E2E8E2;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(44,62,45,0.1);}
.email-chrome{background:#F4F7F4;padding:10px 16px;border-bottom:1px solid #E2E8E2;display:flex;align-items:center;gap:8px;}
.email-chrome-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px;}
.email-header{background:#2C3E2D;padding:16px 24px;border-bottom:3px solid #E8651A;}
.email-meta{background:#FAFAFA;padding:12px 24px;border-bottom:1px solid #E2E8E2;}
.email-body{background:#fff;padding:32px 40px;max-height:400px;overflow-y:auto;}
.email-footer{background:#F4F7F4;padding:16px 24px;border-top:1px solid #E2E8E2;text-align:center;font-size:11px;color:#5C6B5D;}
.topic-card{border:1.5px solid #E2E8E2;border-radius:10px;padding:14px;cursor:pointer;background:#fff;}
.topic-card:hover{border-color:#3d8b4060;}
.topic-card.selected{border-color:#3d8b40;background:#EBF5EC;}
.tag{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:2px 6px;margin:2px 2px 0 0;}
.toggle-btn{padding:8px 18px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #E2E8E2;background:#fff;color:#5C6B5D;}
.toggle-btn.active{background:#3d8b40;color:#fff;border-color:#3d8b40;}
#refresh-btn{background:none;border:1px solid #ffffff40;border-radius:7px;color:#a8c5a9;font-size:12px;padding:4px 12px;cursor:pointer;font-family:inherit;margin-left:8px;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px;">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="17" fill="white" stroke="#E8651A" stroke-width="2"/>
      <circle cx="18" cy="18" r="13" fill="none" stroke="#3d8b40" stroke-width="1.5"/>
      <path d="M11 18 L16 23 L25 12" stroke="#3d8b40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="logo-text">EUNOMIA PHARMA</div>
      <div class="logo-sub">Marketing Hub</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
    <span id="dot-li" class="status-dot status-loading">LinkedIn</span>
    <span id="dot-sr" class="status-dot status-loading">Sales Robot</span>
    <span id="dot-mc" class="status-dot status-loading">Mailchimp</span>
    <span id="dot-ht" class="status-dot status-loading">Hunter.io</span>
    <button id="refresh-btn" onclick="loadAll()">Refresh</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="showTab('overview')">Overview</button>
  <button class="tab" onclick="showTab('linkedin')">LinkedIn</button>
  <button class="tab" onclick="showTab('salesrobot')">Sales Robot</button>
  <button class="tab" onclick="showTab('mailchimp')">Mailchimp</button>
  <button class="tab" onclick="showTab('hunter')">Hunter.io</button>
  <button class="tab" onclick="showTab('newsletter')">Newsletter</button>
  <button class="tab" onclick="showTab('regulatory')">Regulatory</button>
  <button class="tab" onclick="showTab('clients')">Clients</button>
</div>

<!-- CONTENT PANELS -->
<div class="content">
  <div id="panel-overview"></div>
  <div id="panel-linkedin" style="display:none"></div>
  <div id="panel-salesrobot" style="display:none"></div>
  <div id="panel-mailchimp" style="display:none"></div>
  <div id="panel-hunter" style="display:none"></div>
  <div id="panel-newsletter" style="display:none"></div>
  <div id="panel-regulatory" style="display:none"></div>
  <div id="panel-clients" style="display:none"></div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
var STATE = {
  mc: null, ht: null, li: null, sr: null,
  mock: {}, errors: {},
  chatHist: [],
  draft: '', draftSubj: '',
  topics: [], selTopics: [],
  composerOpen: false, composerStep: 'topics',
  leads: null, hunterView: 'search',
  campaign: null, showCreator: false,
  showComposer: false,
  currentTab: 'overview'
};

var MOCK = {
  mc: {subscribers:834,openRate:'31.4',lastSent:new Date(Date.now()-25*86400000).toISOString(),
    lastSubject:'PMCPA Social Media Guidance: What It Means For Your Team',
    campaigns:[
      {id:'1',name:'PMCPA Social Media Guidance Alert',date:'08/04/2025',sent:834,opens:'34.2%',clicks:'5.1%',status:'sent'},
      {id:'2',name:'March Regulatory Roundup',date:'18/03/2025',sent:801,opens:'29.7%',clicks:'3.9%',status:'sent'},
      {id:'3',name:'ABPI Code 2024 Key Changes',date:'28/02/2025',sent:788,opens:'38.1%',clicks:'6.2%',status:'sent'}
    ]},
  ht:{creditsUsed:312,creditsTotal:500,verificationUsed:289,verificationTotal:500,plan:'Starter'},
  li:{name:'Eunomia Consulting',connections:1247,email:''},
  sr:{summary:{activeSequences:4,messagesSent:586,replies:86,replyRate:'24.1'},
    campaigns:[
      {name:'List 1: Medical Directors',sent:194,replies:24,rate:'25.29',status:'active'},
      {name:'Legal',sent:213,replies:35,rate:'25.72',status:'active'},
      {name:'Compliance and Ethics',sent:120,replies:20,rate:'21.42',status:'active'},
      {name:'Pharma Leaders - Compliance Ethics Medical Legal',sent:59,replies:7,rate:'21.77',status:'active'}
    ]}
};

// ============================================================
// HELPERS
// ============================================================
function daysSince(iso){return Math.floor((Date.now()-new Date(iso))/86400000);}
function nextDue(iso){var d=new Date(iso);d.setDate(d.getDate()+30);return d;}
function daysUntil(iso){return Math.max(0,Math.ceil((nextDue(iso)-Date.now())/86400000));}
function fmtDate(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pill(label,color){return '<span class="pill" style="background:'+color+'18;color:'+color+'">'+esc(label)+'</span>';}
function spinner(){return '<span class="spinner"></span>';}
function alert_(type,html){var cls={warning:'alert-warning',error:'alert-error',success:'alert-success',info:'alert-info'}[type]||'alert-info';return '<div class="alert '+cls+'">'+html+'</div>';}

async function apiGet(path){
  try{var r=await fetch(path);return await r.json();}
  catch(e){return{error:e.message};}
}
async function apiPost(path,body){
  try{var r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}
  catch(e){return{error:e.message};}
}
async function callClaude(messages,system){
  var r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages,system:system})});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||'AI error '+r.status);}
  var d=await r.json();
  if(d.error)throw new Error(d.error);
  // Handle both streaming-style and direct response
  if(d.content&&Array.isArray(d.content)){return d.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');}
  if(typeof d==='string')return d;
  // Parse SSE-style fake stream response
  var text=String(d);
  return text;
}

// Non-streaming Claude call - returns full text
async function aiCall(messages,system){
  var r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages,system:system})});
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e.error||'AI error '+r.status);}
  // Read the SSE response
  var reader=r.body.getReader();
  var dec=new TextDecoder();
  var full='';
  while(true){
    var rv=await reader.read();
    if(rv.done)break;
    var lines=dec.decode(rv.value,{stream:true}).split('\n');
    for(var i=0;i<lines.length;i++){
      if(lines[i].startsWith('data: ')){
        try{
          var j=JSON.parse(lines[i].slice(6));
          if(j.type==='content_block_delta'&&j.delta&&j.delta.text)full+=j.delta.text;
        }catch(x){}
      }
    }
  }
  if(!full)throw new Error('No response. Check ANTHROPIC_API_KEY has credits.');
  return full;
}

// ============================================================
// TAB SWITCHING
// ============================================================
function showTab(id){
  STATE.currentTab=id;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('[id^="panel-"]').forEach(function(p){p.style.display='none';});
  event.target.classList.add('active');
  document.getElementById('panel-'+id).style.display='block';
  renderTab(id);
}
function renderTab(id){
  if(id==='overview')renderOverview();
  else if(id==='linkedin')renderLinkedIn();
  else if(id==='salesrobot')renderSalesRobot();
  else if(id==='mailchimp')renderMailchimp();
  else if(id==='hunter')renderHunter();
  else if(id==='newsletter')renderNewsletter();
  else if(id==='regulatory')renderRegulatory();
  else if(id==='clients')renderClients();
}

// ============================================================
// STATUS DOTS
// ============================================================
function setDot(id,state){
  var el=document.getElementById('dot-'+id);
  if(!el)return;
  el.className='status-dot';
  if(state==='live'){el.classList.add('status-live');el.textContent='Live: '+el.textContent.replace(/^(Live|Demo): /,'');}
  else if(state==='demo'){el.classList.add('status-demo');el.textContent='Demo: '+el.textContent.replace(/^(Live|Demo): /,'');}
  else{el.classList.add('status-loading');}
}

// ============================================================
// LOAD ALL PLATFORMS
// ============================================================
async function loadAll(){
  ['li','sr','mc','ht'].forEach(function(k){setDot(k,'loading');});
  // Show loading state immediately so page is not blank
  renderTab(STATE.currentTab);
  var results=await Promise.all([
    apiGet('/api/mailchimp?action=stats'),
    apiGet('/api/hunter?action=account'),
    apiGet('/api/linkedin?action=profile'),
    apiGet('/api/salesrobot?action=campaigns')
  ]);
  var mcD=results[0],htD=results[1],liD=results[2],srD=results[3];
  
  if(mcD.error){STATE.mock.mc=true;STATE.mc=MOCK.mc;setDot('mc','demo');}
  else{STATE.mc=mcD;setDot('mc','live');}
  
  if(htD.error){STATE.mock.ht=true;STATE.ht=MOCK.ht;setDot('ht','demo');}
  else{STATE.ht=htD;setDot('ht','live');}
  
  if(liD.error){STATE.mock.li=true;STATE.li=MOCK.li;setDot('li','demo');}
  else{STATE.li=liD;setDot('li','live');}
  
  if(srD.error){STATE.mock.sr=true;STATE.sr=MOCK.sr;setDot('sr','demo');}
  else{STATE.sr=srD;setDot('sr','live');}
  
  renderTab(STATE.currentTab);
}

// ============================================================
// STAT CARD
// ============================================================
function statCard(label,value,sub){
  return '<div class="stat"><div class="stat-label">'+esc(label)+'</div><div class="stat-value">'+esc(value||'--')+'</div>'+(sub?'<div class="stat-sub">'+esc(sub)+'</div>':'')+'</div>';
}

// ============================================================
// OVERVIEW
// ============================================================
function renderOverview(){
  var mc=STATE.mc,ht=STATE.ht,li=STATE.li,sr=STATE.sr;
  var html='';
  
  // Demo notice
  var demos=Object.keys(STATE.mock);
  if(demos.length)html+=alert_('warning','Demo mode: '+demos.join(', ')+' showing sample data. Add API keys in Vercel to see live data.');
  
  // Stats
  html+='<div class="grid4">';
  html+=statCard('LinkedIn Connections',li&&li.connections?li.connections.toLocaleString():'--',li&&li.name&&li.name!=='undefined undefined'?li.name:'');
  html+=statCard('Reply Rate',sr&&sr.summary?sr.summary.replyRate+'%':'--',sr?sr.summary.replies+' replies from '+sr.summary.messagesSent+' sent':'');
  html+=statCard('Open Rate',mc&&mc.openRate?mc.openRate+'%':'--',mc?mc.subscribers.toLocaleString()+' subscribers':'');
  html+=statCard('Hunter Credits',ht?ht.creditsUsed+'/'+ht.creditsTotal:'--',ht?ht.plan:'');
  html+='</div>';
  
  // Newsletter banner
  if(mc&&mc.lastSent){
    var due=daysUntil(mc.lastSent);
    var bgc=due<=7?'#FEF0E8':'#EBF5EC';
    var bdc=due<=7?'#E8651A':'#3d8b40';
    html+='<div class="banner" style="background:'+bgc+';border:1px solid '+bdc+'30;">';
    html+='<div><div style="font-size:12px;font-weight:600;color:'+bdc+';margin-bottom:4px;">'+(due<=7?'Newsletter due soon':'Newsletter schedule')+'</div>';
    html+='<div style="font-size:14px;font-weight:600;">Next due: '+fmtDate(nextDue(mc.lastSent))+' <span style="font-weight:400;color:#5C6B5D;">('+due+' days)</span></div>';
    html+='<div style="font-size:12px;color:#5C6B5D;margin-top:2px;">Last sent '+daysSince(mc.lastSent)+' days ago</div></div>';
    html+='<button class="btn btn-primary" onclick="goNewsletter()">Create Newsletter</button>';
    html+='</div>';
  }
  
  // Two col
  html+='<div class="grid2">';
  
  // Chat
  html+='<div class="card"><div class="card-title">AI Marketing Assistant</div>';
  html+='<div class="chat-box" id="chat-messages">';
  if(STATE.chatHist.length===0)html+='<div style="color:#5C6B5D;font-size:13px;">Ask about your platform performance, newsletter timing, outreach strategy...</div>';
  STATE.chatHist.forEach(function(m){
    html+='<div style="display:flex;justify-content:'+(m.role==='user'?'flex-end':'flex-start')+'">';
    html+='<div class="'+(m.role==='user'?'chat-user':'chat-ai')+'">'+esc(m.content)+'</div></div>';
  });
  html+='</div>';
  html+='<div style="display:flex;gap:8px;"><input id="chat-input" placeholder="How is my reply rate? When should I send next?" onkeydown="if(event.key===\'Enter\')sendChat()"/>';
  html+='<button class="btn btn-primary" onclick="sendChat()">Send</button></div></div>';
  
  // Campaigns
  html+='<div class="card"><div class="card-title">Recent Mailchimp Campaigns</div>';
  if(mc&&mc.campaigns){
    mc.campaigns.forEach(function(c){
      html+='<div class="row"><div style="flex:1"><div style="font-weight:600;">'+esc(c.name)+'</div><div style="font-size:12px;color:#5C6B5D;">'+esc(c.date)+' &middot; '+esc(String(c.sent))+' sent</div></div>';
      html+=pill(c.opens,'#3d8b40')+' '+pill(c.clicks,'#3d8b40')+'</div>';
    });
  }
  html+='</div></div>';
  
  document.getElementById('panel-overview').innerHTML=html;
}

async function sendChat(){
  var input=document.getElementById('chat-input');
  if(!input||!input.value.trim())return;
  var msg=input.value.trim();
  input.value='';
  STATE.chatHist.push({role:'user',content:msg});
  renderOverview();
  var mc=STATE.mc,ht=STATE.ht,li=STATE.li,sr=STATE.sr;
  var sys='You are Eunomia marketing assistant. Data: Mailchimp: '+(mc?mc.subscribers+' subscribers, '+mc.openRate+'% open rate. Last newsletter '+daysSince(mc.lastSent)+' days ago. Next due: '+fmtDate(nextDue(mc.lastSent))+' ('+daysUntil(mc.lastSent)+' days away).':'Not connected.')+' Hunter: '+(ht?ht.creditsUsed+'/'+ht.creditsTotal+' credits.':'Not connected.')+' Sales Robot: '+(sr?sr.summary.activeSequences+' sequences, '+sr.summary.replyRate+'% reply rate.':'Not connected.')+' Give specific actionable pharma compliance marketing advice.';
  try{
    var reply=await aiCall(STATE.chatHist,sys);
    STATE.chatHist.push({role:'assistant',content:reply});
  }catch(e){
    STATE.chatHist.push({role:'assistant',content:'Error: '+e.message});
  }
  renderOverview();
  var box=document.getElementById('chat-messages');
  if(box)box.scrollTop=box.scrollHeight;
}

// ============================================================
// LINKEDIN
// ============================================================
function renderLinkedIn(){
  var li=STATE.li;
  var liName=(li&&li.name&&li.name!=='undefined undefined')?li.name:(li&&li.email?li.email:'Connected');
  var html='';
  if(STATE.mock.li)html+=alert_('warning','Showing demo data. Add LINKEDIN_ACCESS_TOKEN in Vercel env vars.');
  html+='<div class="grid3">';
  html+=statCard('Account',liName,'LinkedIn profile');
  html+=statCard('Connections',li&&li.connections?li.connections.toLocaleString():'--','Total network');
  html+=statCard('Status',STATE.mock.li?'Demo':'Live',STATE.mock.li?'Add token for live data':'Token connected');

async function genLinkedInPost(){
  var btn=document.getElementById('li-gen-btn');
  if(btn)btn.textContent='Writing...';
  try{
    var text=await aiCall(
      [{role:'user',content:'Write a LinkedIn post for Eunomia Pharma Services, a UK pharma compliance consultancy. Topic: a current pharma regulatory update (PMCPA, ABPI Code 2024, or compliance best practice). 150-200 words. 3-4 relevant hashtags at end. No emojis. Ready to post immediately.'}],
      'You are a LinkedIn content expert for pharma compliance. Write posts that position Eunomia as a thought leader. Direct and insightful.'
    );
    var ta=document.getElementById('li-text');
    if(ta){ta.value=text;updateCharCount();}
  }catch(e){
    var res=document.getElementById('li-result');
    if(res)res.innerHTML=alert_('error','Error: '+e.message);
  }
  if(btn)btn.textContent='Generate AI Draft';
}

function updateCharCount(){
  var ta=document.getElementById('li-text');
  var cc=document.getElementById('li-char-count');
  if(ta&&cc)cc.textContent=ta.value.length+'/3000';
}

async function postToLinkedIn(){
  var ta=document.getElementById('li-text');
  var ps=document.getElementById('post-as');
  var res=document.getElementById('li-result');
  if(!ta||!ta.value.trim())return;
  if(res)res.innerHTML=spinner()+' Posting...';
  var data=await apiPost('/api/linkedin?action=post',{text:ta.value,postAs:ps?ps.value:'person'});
  if(data.success){
    if(res)res.innerHTML=alert_('success','Posted successfully! <a href="https://www.linkedin.com/feed/" target="_blank" style="color:#3d8b40;font-weight:600;">View feed</a>');
    ta.value='';
  }else{
    if(res)res.innerHTML=alert_('error','Could not post: '+esc(data.error||'Unknown error')+(data.error==='Permission denied'?' Add w_member_social scope to your LinkedIn token and update LINKEDIN_ACCESS_TOKEN in Vercel.':''));
  }
}

async function generateCampaign(){
  var title=document.getElementById('cr-title');
  var industry=document.getElementById('cr-industry');
  var size=document.getElementById('cr-size');
  var topic=document.getElementById('cr-topic');
  var btn=document.getElementById('cr-btn');

  if(!title||!title.value.trim()){if(err)err.innerHTML=alert_('error','Please enter a job title.');return;}
  if(btn)btn.textContent='Generating...';
  if(err)err.innerHTML='';
  var prompt='Generate a LinkedIn Sales Robot outreach campaign for Eunomia Pharma Services targeting '+title.value+' in '+(industry?industry.value:'Pharmaceutical')+' companies ('+(size?size.value:'500-5000')+' employees).'+(topic&&topic.value?' Topic: '+topic.value+'.':'')+' Eunomia is a UK pharma compliance consultancy. Generate: (1) campaign name, (2) ICP for Sales Navigator, (3) Message 1 connection note under 300 chars, (4) Message 2 follow-up Day 5 under 500 chars, (5) Message 3 direct ask Day 10 under 500 chars. Messages sound human, reference a compliance pain point, no emojis. Respond ONLY as JSON: {"campaignName":"...","icp":"...","message1":"...","message2":"...","message3":"..."}';
  try{
    var raw=await aiCall([{role:'user',content:prompt}],'You are a B2B LinkedIn outreach expert for pharma compliance. Write messages that sound like a senior compliance consultant, not a salesperson.');
    var data=JSON.parse(raw.replace(/```json|```/g,'').trim());
    STATE.campaign=data;
    renderSalesRobot();
  }catch(e){
    if(err)err.innerHTML=alert_('error','Error: '+e.message);
    if(btn)btn.textContent='Generate Campaign';
  }
}

function copyText(key){
  var c=STATE.campaign;
  if(!c||!c[key])return;
  navigator.clipboard.writeText(c[key]).then(function(){
    var btn=document.getElementById('copy-'+key);
    if(btn){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy';},2000);}
  });
}

function renderEmailBody(text){
  if(!text)return '';
  return text.split('\n').map(function(line){
    if(!line.trim())return '<div style="height:12px;"></div>';
    var parts=line.split(/\*\*([^*]+)\*\*/g);
    var rendered=parts.map(function(p,j){return j%2===1?'<strong style="color:#1C2B1D;font-weight:700;">'+esc(p)+'</strong>':esc(p);}).join('');
    var isHead=line.startsWith('**')&&line.endsWith('**');
    return '<p style="margin:'+(isHead?'18px 0 6px':'0 0 10px')+';font-size:'+(isHead?'15':'14')+'px;line-height:1.7;color:#2C2C2C;">'+rendered+'</p>';
  }).join('');
}

function toggleEdit(){
  var disp=document.getElementById('email-body-display');
  var edit=document.getElementById('email-body-edit');
  var btn=document.getElementById('edit-toggle');
  if(!disp||!edit)return;
  if(edit.style.display==='none'){edit.style.display='block';disp.style.display='none';if(btn)btn.textContent='Done editing';}
  else{
    STATE.draft=edit.value;
    var m=STATE.draft.match(/SUBJECT:\s*(.+)/);
    if(m)STATE.draftSubj=m[1].trim();
    edit.style.display='none';disp.style.display='block';
    disp.innerHTML=renderEmailBody(edit.value);
    if(btn)btn.textContent='Edit';
  }
}

async function sendToMailchimp(){
  var body=STATE.draft.replace(/SUBJECT:.+\n?---\n?/,'').trim();

  }
}

// Safe localStorage wrapper - prevents crashes if localStorage unavailable
function lsGet(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';

  });
  html += '</div></div>';

  document.getElementById('panel-regulatory').innerHTML = html;
}

function copyAlert(i){
  navigator.clipboard.writeText(GOOGLE_ALERTS[i]).then(function(){
    var btn=document.getElementById('alert-copy-'+i);
    if(btn){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy';},2000);}
  });
}

async function genRegulatoryInsight(){
  var body=document.getElementById('reg-body');
  var format=document.getElementById('reg-format');
  var topic=document.getElementById('reg-topic');
  var btn=document.getElementById('reg-gen-btn');
  var out=document.getElementById('reg-output');
  if(!body||!body.value){if(out)out.innerHTML=alert_('error','Please select a regulatory body.');return;}
  if(btn)btn.textContent='Generating...';
  var bodyName=body.value;
  var formatName=format?format.value:'client-alert';
  var topicText=topic?topic.value:'';
  var bodyInfo=REG_BODIES.find(function(b){return b.name===bodyName;})||{};
  var formatInstructions={
    'client-alert':'Write a short client alert email (150-200 words). Subject line first, then body. Professional, plain English, explains what changed and what clients should do. Sign off as Eunomia Pharma Services.',
    'linkedin':'Write a LinkedIn post (150-200 words) positioning Eunomia as a regulatory intelligence leader. End with 3-4 relevant hashtags. No emojis.',
    'newsletter':'Write a newsletter section (200-300 words) with a bold heading. Explain the regulatory development and its practical implications for pharma compliance teams.',
    'briefing':'Write an internal team briefing (200-300 words). Heading, summary of the update, client impact assessment, and recommended Eunomia actions.'
  }[formatName]||'Write a professional compliance briefing.';
  var prompt='You are a senior pharma compliance expert at Eunomia Pharma Services. Generate '+formatName+' content about '+bodyName+' ('+bodyInfo.country+') for pharma compliance professionals. '+bodyInfo.desc+(topicText?' Specific topic: '+topicText+'.':' Focus on the most recent and relevant guidance or update.')+' '+formatInstructions+' Be specific, authoritative, and practically useful. Include a clear call to action to contact Eunomia for guidance.';
  try{
    var text=await aiCall([{role:'user',content:prompt}],'You are a senior pharma regulatory compliance expert at Eunomia Pharma Services. Write clear, authoritative content that positions Eunomia as the go-to compliance partner.');
    if(out){
      out.innerHTML='<div style="border:1px solid #E2E8E2;border-radius:10px;overflow:hidden;">';
      out.innerHTML+='<div style="background:#2C3E2D;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;"><span style="color:#fff;font-weight:600;font-size:13px;">'+esc(bodyName)+' - '+esc(formatName.replace('-',' '))+'</span><button onclick="copyInsight()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;" id="copy-insight-btn">Copy</button></div>';
      out.innerHTML+='<div style="padding:16px;font-size:13px;line-height:1.75;white-space:pre-wrap;color:#1C2B1D;" id="insight-text">'+esc(text)+'</div></div>';
      out.innerHTML+='<div style="margin-top:10px;display:flex;gap:10px;"><button class="btn btn-secondary" onclick="genRegulatoryInsight()">Regenerate</button><button class="btn btn-primary" onclick="shareToLinkedIn()">Post to LinkedIn</button></div>';
      REG_STATE.insight=text;
    }
  }catch(e){if(out)out.innerHTML=alert_('error','Error: '+e.message);}
  if(btn)btn.textContent='Generate Insight';
}

function copyInsight(){
  var el=document.getElementById('insight-text');
  if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(function(){
    var btn=document.getElementById('copy-insight-btn');
    if(btn){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy';},2000);}
  });
}

function shareToLinkedIn(){
  var el=document.getElementById('insight-text');
  if(!el)return;
  STATE.showComposer=true;
  showTab('linkedin');
  setTimeout(function(){
    var ta=document.getElementById('li-text');
    if(ta)ta.value=el.textContent;
  },300);
}

async function genOnboarding(){
  var client=document.getElementById('ob-client');
  var contact=document.getElementById('ob-contact');
  var services=document.getElementById('ob-services');
  var consultant=document.getElementById('ob-consultant');
  var start=document.getElementById('ob-start');
  var cadence=document.getElementById('ob-cadence');
  var btn=document.getElementById('ob-btn');
  var out=document.getElementById('ob-output');
  if(!client||!client.value.trim()){if(out)out.innerHTML=alert_('error','Please enter the client name.');return;}
  if(btn)btn.textContent='Generating...';
  var prompt='Generate a professional new client onboarding pack for Eunomia Pharma Services. Client: '+client.value+'. Contact: '+(contact?contact.value:'[Contact Name]')+'. Services: '+(services?services.value:'pharma compliance consulting')+'. Eunomia lead: '+(consultant?consultant.value:'Eunomia Team')+'. Start date: '+(start&&start.value?start.value:'[Start Date]')+'. Review cadence: '+(cadence?cadence.value:'Monthly')+'.

Generate a complete onboarding pack with these four sections:
1. WELCOME LETTER - Warm, professional letter from Eunomia welcoming the client, expressing commitment to the partnership, outlining what happens next in the first 30 days.
2. KEY CONTACTS - Eunomia team contacts (use the consultant name provided), escalation path, and expected response times.
3. SERVICE SCOPE SUMMARY - Clear summary of exactly what is included in the engagement, what is out of scope, and key deliverables with indicative timelines.
4. COMMUNICATION CADENCE - Meeting schedule (30-day check-in, then recurring reviews), reporting format, how to raise urgent issues, and how regulatory updates will be communicated.

Tone: professional, warm, reassuring. Format with clear section headings. This will be sent to the client as their first impression of working with Eunomia.';
  try{
    var text=await aiCall([{role:'user',content:prompt}],'You are a senior pharma compliance consultant at Eunomia Pharma Services writing a new client onboarding document. Be professional, warm and specific.');
    if(out){
      out.innerHTML='<div style="border:1px solid #E2E8E2;border-radius:10px;overflow:hidden;">';
      out.innerHTML+='<div style="background:#2C3E2D;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;"><span style="color:#fff;font-weight:600;">Onboarding Pack - '+esc(client.value)+'</span>';
      out.innerHTML+='<div style="display:flex;gap:8px;"><button onclick="copyDoc('ob-doc-text')" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;">Copy</button>';
      out.innerHTML+='<button onclick="downloadDoc('ob-doc-text','Onboarding-'+esc(client.value.replace(/\s+/g,'-'))+'.txt')" style="background:#E8651A;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;">Download</button></div></div>';

    }
  }catch(e){if(out)out.innerHTML=alert_('error','Error: '+e.message);}
  if(btn)btn.textContent='Generate Onboarding Pack';
}

    }
  }catch(e){if(out)out.innerHTML=alert_('error','Error: '+e.message);}
  if(btn)btn.textContent='Generate Testimonial Request';
}

// CASE STUDY GENERATOR
function renderCaseStudy(){
  var html='<div class="card"><div class="card-title">Case Study Generator</div>';
  html+='<div style="font-size:13px;color:#5C6B5D;margin-bottom:16px;">Generate a professional anonymised case study ready to add to your website, proposals, and LinkedIn content. Based on your service delivery for a client.</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">';
  html+='<div><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">CLIENT TYPE (anonymised)</label><input id="cs-client" placeholder="e.g. Mid-size UK biotech, 300 employees"/></div>';
  html+='<div><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">SERVICE PROVIDED</label><select id="cs-service" style="width:100%;"><option>ABPI Code compliance review</option><option>HCP engagement compliance</option><option>ABAC and anti-bribery framework</option><option>Due diligence programme</option><option>Compliance training - Sales Reps and MSLs</option><option>SOP development and review</option><option>Gifts and hospitality policy</option><option>Conflict of interest management</option><option>Audit preparation and readiness</option><option>Regulatory monitoring and analytics</option><option>Medical affairs compliance</option><option>Third-party vendor risk</option></select></div>';
  html+='<div style="grid-column:1/-1;"><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">CHALLENGE THE CLIENT FACED</label><textarea id="cs-challenge" rows="3" placeholder="e.g. The client was preparing for an ABPI audit with inconsistent SOPs across three EU affiliates and no centralised review process..."></textarea></div>';
  html+='<div style="grid-column:1/-1;"><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">WHAT EUNOMIA DID</label><textarea id="cs-approach" rows="3" placeholder="e.g. Eunomia conducted a gap analysis across all affiliates, standardised the SOP library, and delivered a 2-day audit readiness workshop..."></textarea></div>';
  html+='<div style="grid-column:1/-1;"><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">MEASURABLE OUTCOME</label><input id="cs-outcome" placeholder="e.g. Client passed ABPI audit with zero critical findings; review turnaround reduced by 40%"/></div>';
  html+='<div><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">FORMAT</label><select id="cs-format" style="width:100%;"><option value="website">Website case study</option><option value="proposal">Proposal insert (concise)</option><option value="linkedin">LinkedIn story post</option></select></div>';
  html+='<div><label style="font-size:12px;font-weight:600;color:#5C6B5D;display:block;margin-bottom:6px;">INCLUDE QUOTE</label><select id="cs-quote" style="width:100%;"><option value="yes">Yes - generate an illustrative quote</option><option value="no">No quote</option></select></div></div>';
  html+='<button class="btn btn-primary" id="cs-btn" onclick="genCaseStudy()" style="margin-bottom:14px;">Generate Case Study</button>';
  html+='<div id="cs-output"></div></div>';

  // Saved case studies
  var stored=lsGet('eunomia-casestudies',[]);
  html+='<div class="card"><div class="card-title">Saved Case Studies ('+stored.length+')</div>';
  if(stored.length){
    stored.forEach(function(cs,i){
      html+='<div style="border:1px solid #E2E8E2;border-radius:10px;padding:14px;margin-bottom:10px;">';
      html+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">';
      html+='<div><div style="font-weight:600;font-size:14px;margin-bottom:4px;">'+esc(cs.title)+'</div><div style="font-size:12px;color:#5C6B5D;">'+esc(cs.service)+' &middot; Saved '+esc(cs.date)+'</div></div>';
      html+='<div style="display:flex;gap:6px;flex-shrink:0;">';
      html+='<button onclick="viewCaseStudy('+i+')" style="background:none;border:1px solid #E2E8E2;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;">View</button>';
      html+='<button onclick="copyCaseStudy('+i+')" style="background:none;border:1px solid #E2E8E2;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;">Copy</button>';
      html+='<button onclick="deleteCaseStudy('+i+')" style="background:none;border:1px solid #FEE2E2;color:#DC2626;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;">Delete</button></div></div>';
      html+='<div id="cs-view-'+i+'" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid #E2E8E2;font-size:13px;line-height:1.7;white-space:pre-wrap;color:#1C2B1D;">'+esc(cs.content)+'</div>';
      html+='</div>';
    });
  }else{html+='<div style="color:#5C6B5D;font-size:13px;">No case studies saved yet. Generate your first one above.</div>';}
  html+='</div>';
  return html;
}

async function genCaseStudy(){
  var client=document.getElementById('cs-client');
  var service=document.getElementById('cs-service');
  var challenge=document.getElementById('cs-challenge');
  var approach=document.getElementById('cs-approach');
  var outcome=document.getElementById('cs-outcome');
  var format=document.getElementById('cs-format');
  var quote=document.getElementById('cs-quote');
  var btn=document.getElementById('cs-btn');
  var out=document.getElementById('cs-output');
  if(!challenge||!challenge.value.trim()){if(out)out.innerHTML=alert_('error','Please describe the challenge the client faced.');return;}
  if(btn)btn.textContent='Generating...';
  var formatInstructions={'website':'Write a full website case study with sections: The Client (anonymised), The Challenge, Our Approach, The Outcome. 400-500 words. Professional and compelling. Add a 2-sentence client quote if requested.','proposal':'Write a concise case study for a proposal insert. 150-200 words. Challenge, approach, outcome format. Punchy and results-focused.','linkedin':'Write a LinkedIn story post about this client success. 200-250 words. First-person narrative from Eunomia perspective. End with a question or CTA. No emojis.'}[format?format.value:'website'];
  var prompt='Generate a professional anonymised case study for Eunomia Pharma Services.

Client type: '+(client?client.value:'pharma company')+'
Service: '+(service?service.value:'compliance consulting')+'
Challenge: '+(challenge?challenge.value:'')+'
Approach: '+(approach&&approach.value?approach.value:'Eunomia provided expert compliance support')+'
Outcome: '+(outcome&&outcome.value?outcome.value:'significant compliance improvements achieved')+'
Include quote: '+(quote?quote.value:'yes')+'

'+formatInstructions+'

Do not name the client. Use language like "a leading UK biotech" or "a mid-size pharma company". Position Eunomia as expert, agile and commercially aware.';
  try{
    var text=await aiCall([{role:'user',content:prompt}],'You are a senior pharma compliance expert writing a case study for Eunomia Pharma Services. Be specific, results-focused, and position Eunomia as the go-to compliance partner for growing pharma companies.');
    if(out){
      var clientDesc=client?client.value:'Pharma Client';
      var serviceDesc=service?service.value:'Compliance';
      out.innerHTML='<div style="border:1px solid #E2E8E2;border-radius:10px;overflow:hidden;">';
      out.innerHTML+='<div style="background:#2C3E2D;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;"><span style="color:#fff;font-weight:600;">Case Study Generated</span><div style="display:flex;gap:8px;">';
      out.innerHTML+='<button onclick="copyDoc('cs-doc-text')" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;">Copy</button>';
      out.innerHTML+='<button onclick="saveCaseStudy(''+esc(clientDesc)+'',''+esc(serviceDesc)+'')" style="background:#E8651A;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;">Save</button>';
      out.innerHTML+='<button onclick="downloadDoc('cs-doc-text','CaseStudy-'+esc(clientDesc.replace(/\s+/g,'-'))+'.txt')" style="background:#3d8b40;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;">Download</button></div></div>';
      out.innerHTML+='<div style="padding:20px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:#1C2B1D;max-height:500px;overflow-y:auto;" id="cs-doc-text">'+esc(text)+'</div></div>';
    }
  }catch(e){if(out)out.innerHTML=alert_('error','Error: '+e.message);}
  if(btn)btn.textContent='Generate Case Study';
}

function saveCaseStudy(clientDesc,serviceDesc){
  var el=document.getElementById('cs-doc-text');
  if(!el)return;
  var stored=lsGet('eunomia-casestudies',[]);
  stored.unshift({title:clientDesc+' - '+serviceDesc,service:serviceDesc,content:el.textContent,date:new Date().toLocaleDateString('en-GB')});
  lsSet('eunomia-casestudies',stored);
  alert('Case study saved!');
  renderClients();
}
function viewCaseStudy(i){
  var el=document.getElementById('cs-view-'+i);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}
function copyCaseStudy(i){
  var stored=lsGet('eunomia-casestudies',[]);
  if(stored[i])navigator.clipboard.writeText(stored[i].content);
}
function deleteCaseStudy(i){
  var stored=lsGet('eunomia-casestudies',[]);
  stored.splice(i,1);
  lsSet('eunomia-casestudies',stored);
  renderClients();
}

// CLIENT TRACKER
function renderClientTracker(){
  var clients=lsGet('eunomia-clients-list',[]);
  var html='<div class="card"><div class="card-title">Client Tracker</div>';
  html+='<div style="font-size:13px;color:#5C6B5D;margin-bottom:16px;">Track your active clients, their 90-day testimonial due date, and onboarding status.</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;">';
  html+='<input id="new-client-name" placeholder="Client name"/>';
  html+='<input id="new-client-start" type="date" title="Engagement start date"/>';
  html+='<button class="btn btn-primary" onclick="addClient()">Add Client</button></div>';
  if(clients.length){
    html+='<div style="border:1px solid #E2E8E2;border-radius:10px;overflow:hidden;">';
    html+='<div style="display:grid;grid-template-columns:1fr 100px 120px 100px 80px;gap:8px;padding:8px 12px;background:#F5F6F5;font-size:11px;font-weight:600;color:#5C6B5D;text-transform:uppercase;letter-spacing:0.05em;">';
    html+='<span>Client</span><span>Start</span><span>Testimonial due</span><span>Status</span><span>Action</span></div>';
    clients.forEach(function(c,i){
      var start=new Date(c.start);
      var testimonialDue=new Date(c.start);testimonialDue.setDate(testimonialDue.getDate()+90);
      var daysToTm=Math.ceil((testimonialDue-Date.now())/86400000);
      var tmStatus=c.testimonialReceived?'Received':daysToTm<0?'Overdue':daysToTm<14?'Due soon':'Pending';
      var tmColor=c.testimonialReceived?'#3d8b40':daysToTm<0?'#DC2626':daysToTm<14?'#E8651A':'#6B7280';
      html+='<div style="display:grid;grid-template-columns:1fr 100px 120px 100px 80px;gap:8px;padding:10px 12px;border-top:1px solid #E2E8E2;align-items:center;">';
      html+='<span style="font-weight:600;font-size:13px;">'+esc(c.name)+'</span>';
      html+='<span style="font-size:12px;color:#5C6B5D;">'+esc(start.toLocaleDateString('en-GB'))+'</span>';
      html+='<span style="font-size:12px;color:#5C6B5D;">'+esc(testimonialDue.toLocaleDateString('en-GB'))+'</span>';
      html+='<span style="font-size:11px;font-weight:600;color:'+tmColor+';">'+tmStatus+'</span>';
      html+='<button onclick="markTestimonialReceived('+i+')" style="background:none;border:1px solid #E2E8E2;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">'+(c.testimonialReceived?'Received':'Mark done')+'</button>';
      html+='</div>';
    });
    html+='</div>';
  }else{html+='<div style="color:#5C6B5D;font-size:13px;">No clients added yet. Add your first client above to start tracking.</div>';}
  html+='</div>';
  return html;
}

function addClient(){
  var name=document.getElementById('new-client-name');
  var start=document.getElementById('new-client-start');
  if(!name||!name.value.trim())return;
  var clients=lsGet('eunomia-clients-list',[]);
  clients.push({name:name.value.trim(),start:start&&start.value?start.value:new Date().toISOString().slice(0,10),testimonialReceived:false});
  lsSet('eunomia-clients-list',clients);
  name.value='';if(start)start.value='';
  renderClients();
}
function markTestimonialReceived(i){
  var clients=lsGet('eunomia-clients-list',[]);
  clients[i].testimonialReceived=!clients[i].testimonialReceived;
  lsSet('eunomia-clients-list',clients);
  renderClients();
}

function copyDoc(id){
  var el=document.getElementById(id);
  if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(function(){alert('Copied to clipboard!');});
}
function downloadDoc(id,filename){
  var el=document.getElementById(id);
  if(!el)return;
  var blob=new Blob([el.textContent],{type:'text/plain'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename||'eunomia-document.txt';a.click();
}
