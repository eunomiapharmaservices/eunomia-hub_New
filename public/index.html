// -- Mailchimp Tab ------------------------------------------------------------
function MailchimpTab(props){
  var mc=props.mc,usingMock=props.usingMock,onCreateNewsletter=props.onCreateNewsletter;
  var [launching,setLaunching]=useState({});
  var [launchResult,setLaunchResult]=useState({});
  var [confirmId,setConfirmId]=useState(null);

  async function sendCampaign(campaignId){
    setLaunching(function(p){var n=Object.assign({},p);n[campaignId]=true;return n;});
    var r=await apiPost('/api/mailchimp?action=send-campaign',{campaignId:campaignId});
    setLaunchResult(function(p){var n=Object.assign({},p);n[campaignId]=r;return n;});
    setLaunching(function(p){var n=Object.assign({},p);n[campaignId]=false;return n;});
    setConfirmId(null);
  }

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {usingMock ? <Alert type="warning">Showing demo data. Add MAILCHIMP_API_KEY, MAILCHIMP_SERVER_PREFIX and MAILCHIMP_LIST_ID in Vercel env vars.</Alert> : null}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        <Stat label="Subscribers" value={mc?mc.subscribers.toLocaleString():null} sub="Active list"/>
        <Stat label="Open rate" value={mc&&mc.openRate?mc.openRate+'%':null} color={C.green}/>
        <Stat label="Days since last" value={mc&&mc.lastSent?daysSince(mc.lastSent)+'d':null} color={C.amber}/>
        <Stat label="Next due in" value={mc&&mc.lastSent?daysUntil(mc.lastSent)+'d':null} sub={mc&&mc.lastSent?fmtDate(nextDue(mc.lastSent)):null}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <button onClick={onCreateNewsletter}
          style={{background:C.blue,color:'#fff',border:'none',borderRadius:10,padding:'14px 20px',fontSize:14,fontWeight:700,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:24}}>✦</span>
          <div><div>Create new newsletter</div><div style={{fontSize:12,fontWeight:400,opacity:0.8}}>AI-powered topic research and draft</div></div>
        </button>
        <a href="https://us1.admin.mailchimp.com/campaigns/" target="_blank" rel="noreferrer"
          style={{background:'#fff',border:'1px solid #E2E8E2',borderRadius:10,padding:'14px 20px',fontSize:14,fontWeight:700,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:12,textDecoration:'none',color:C.text}}>
          <span style={{fontSize:24}}>&#8599;</span>
          <div><div>Open Mailchimp</div><div style={{fontSize:12,fontWeight:400,color:C.muted}}>Go to campaign manager</div></div>
        </a>
      </div>

      <div className="card">
        <SH>Campaign History</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 100px 70px 70px 70px 130px',gap:8,fontSize:11,fontWeight:600,color:C.muted,paddingBottom:8,borderBottom:'1px solid #E2E8E2',textTransform:'uppercase',letterSpacing:'0.05em'}}>
          <span>Campaign</span><span>Date</span><span style={{textAlign:'center'}}>Sent</span><span style={{textAlign:'center'}}>Opens</span><span style={{textAlign:'center'}}>Clicks</span><span style={{textAlign:'right'}}>Action</span>
        </div>
        {mc&&mc.campaigns&&mc.campaigns.length>0 ? mc.campaigns.map(function(c,i){
          var isDraft=c.status==='draft'||c.status==='save';
          return(
            <div key={i}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 100px 70px 70px 70px 130px',gap:8,alignItems:'center',padding:'10px 0',borderBottom:'1px solid #E2E8E2'}}>
                <div>
                  <div style={{fontWeight:500,fontSize:13}}>{c.name}</div>
                  {isDraft ? <Pill label="Draft" color={C.amber}/> : null}
                </div>
                <span style={{fontSize:12,color:C.muted}}>{c.date}</span>
                <span style={{textAlign:'center',fontSize:13}}>{typeof c.sent==='number'?c.sent.toLocaleString():c.sent}</span>
                <span style={{textAlign:'center'}}><Pill label={c.opens} color={C.green}/></span>
                <span style={{textAlign:'center'}}><Pill label={c.clicks} color={C.blue}/></span>
                <div style={{textAlign:'right'}}>
                  {isDraft ? (
                    confirmId===c.id ? (
                      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                        <button onClick={function(){setConfirmId(null);}} style={{background:'none',border:'1px solid #E2E8E2',borderRadius:6,padding:'4px 8px',fontSize:11,cursor:'pointer'}}>Cancel</button>
                        <button onClick={function(){sendCampaign(c.id);}} disabled={!!launching[c.id]}
                          style={{background:C.red,color:'#fff',border:'none',borderRadius:6,padding:'4px 10px',fontSize:11,fontWeight:600,cursor:'pointer'}}>
                          {launching[c.id] ? 'Sending...' : 'Confirm'}
                        </button>
                      </div>
                    ) : (
                      <button onClick={function(){setConfirmId(c.id);}}
                        style={{background:C.green,color:'#fff',border:'none',borderRadius:6,padding:'5px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        Start Campaign
                      </button>
                    )
                  ) : <span style={{fontSize:12,color:C.muted}}>Sent</span>}
                </div>
              </div>
              {launchResult[c.id] ? (
                <Alert type={launchResult[c.id].error?'error':'success'}>
                  {launchResult[c.id].error?'Error: '+launchResult[c.id].error:'Campaign sent successfully!'}
                </Alert>
              ) : null}
            </div>
          );
        }) : <div style={{color:C.muted,fontSize:13}}>No campaigns found.</div>}
      </div>
    </div>
  );
}

// -- Newsletter Preview -------------------------------------------------------
function NewsletterPreview(props){
  var draft=props.draft,draftSubj=props.draftSubj,draftLoading=props.draftLoading;
  var mcResult=props.mcResult,sending=props.sending,mc=props.mc;
  var onBack=props.onBack,onRegenerate=props.onRegenerate,onSend=props.onSend;
  var [editMode,setEditMode]=useState(false);
  var [editedDraft,setEditedDraft]=useState('');

  var bodyText=(editMode?editedDraft:draft).replace(/SUBJECT:.+\n?---\n?/,'').trim();
  var wordCount=bodyText.trim().split(/\s+/).filter(Boolean).length;

  function renderBody(text){
    if(!text)return null;
    return text.split('\n').map(function(line,i){
      if(!line.trim())return <div key={i} style={{height:12}}/>;
      var parts=line.split(/\*\*([^*]+)\*\*/g);
      var rendered=parts.map(function(p,j){
        if(j%2===1)return <strong key={j} style={{color:'#1C2B1D',fontWeight:700}}>{p}</strong>;
        return <span key={j}>{p}</span>;
      });
      var isHead=line.startsWith('**')&&line.endsWith('**');
      return <p key={i} style={{margin:isHead?'18px 0 6px':'0 0 10px',fontSize:isHead?15:14,lineHeight:1.7,color:'#2C2C2C'}}>{rendered}</p>;
    });
  }

  if(draftLoading&&!draft){
    return(
      <div className="card" style={{textAlign:'center',padding:'40px 20px'}}>
        <Spin s={24}/>
        <div style={{marginTop:14,fontSize:13,color:C.muted}}>Writing your newsletter...</div>
      </div>
    );
  }

  if(!draft)return null;

  return(
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button onClick={onBack} style={{background:'none',border:'1px solid #E2E8E2',borderRadius:7,padding:'7px 12px',fontSize:12,cursor:'pointer',color:C.muted}}>Back</button>
          <button onClick={onRegenerate} disabled={draftLoading} style={{background:'none',border:'1px solid #E2E8E2',borderRadius:7,padding:'7px 12px',fontSize:12,cursor:'pointer',color:C.muted}}>Regenerate</button>
          <button onClick={function(){if(editMode){setEditMode(false);}else{setEditedDraft(bodyText);setEditMode(true);}}}
            style={{background:editMode?C.blueL:'none',border:'1px solid '+(editMode?C.blue:'#E2E8E2'),borderRadius:7,padding:'7px 12px',fontSize:12,cursor:'pointer',color:editMode?C.blue:C.muted,fontWeight:editMode?600:400}}>
            {editMode?'Done editing':'Edit'}
          </button>
        </div>
        <div style={{fontSize:12,color:C.muted}}>{wordCount} words</div>
      </div>

      <div style={{border:'1px solid #E2E8E2',borderRadius:14,overflow:'hidden',boxShadow:'0 4px 24px #2C3E2D10'}}>
        <div style={{background:'#F4F7F4',padding:'10px 16px',borderBottom:'1px solid #E2E8E2',display:'flex',alignItems:'center',gap:8}}>
          <div style={{display:'flex',gap:5}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:'#FC5F5A'}}/>
            <div style={{width:10,height:10,borderRadius:'50%',background:'#FDBC40'}}/>
            <div style={{width:10,height:10,borderRadius:'50%',background:'#34C749'}}/>
          </div>
          <span style={{fontSize:11,color:C.muted,marginLeft:8}}>Email preview</span>
        </div>

        <div style={{background:'#2C3E2D',padding:'16px 24px',borderBottom:'3px solid #E8651A'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <circle cx="14" cy="14" r="13" fill="white" stroke="#E8651A" strokeWidth="1.5"/>
              <path d="M9 14 L13 18 L19 10" stroke="#3d8b40" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <div>
              <div style={{color:'#fff',fontWeight:700,fontSize:12,letterSpacing:'0.05em'}}>EUNOMIA PHARMA SERVICES</div>
              <div style={{color:'#a8c5a9',fontSize:10}}>Regulatory Intelligence Newsletter</div>
            </div>
          </div>
        </div>

        <div style={{background:'#FAFAFA',padding:'12px 24px',borderBottom:'1px solid #E2E8E2'}}>
          <div style={{display:'grid',gridTemplateColumns:'60px 1fr',gap:'4px 12px',fontSize:12}}>
            <span style={{color:C.muted,fontWeight:600}}>From:</span>
            <span>Eunomia Pharma Services &lt;hello@eunomiapharmaservices.com&gt;</span>
            <span style={{color:C.muted,fontWeight:600}}>To:</span>
            <span style={{color:C.muted}}>{mc&&mc.subscribers?mc.subscribers.toLocaleString():'834'} subscribers</span>
            <span style={{color:C.muted,fontWeight:600}}>Subject:</span>
            <span style={{fontWeight:600,color:'#1C2B1D'}}>{draftSubj||'Newsletter'}</span>
          </div>
        </div>

        <div style={{background:'#fff',padding:'32px 40px',maxHeight:520,overflowY:'auto'}}>
          {editMode ? (
            <textarea value={editedDraft} onChange={function(e){setEditedDraft(e.target.value);}}
              style={{width:'100%',minHeight:340,border:'1px solid #E2E8E2',borderRadius:8,padding:'12px',fontSize:14,lineHeight:1.75,resize:'vertical',outline:'none',color:'#2C2C2C'}}/>
          ) : (
            <div style={{maxWidth:560,margin:'0 auto'}}>{renderBody(bodyText)}</div>
          )}
        </div>

        <div style={{background:'#F4F7F4',padding:'16px 24px',borderTop:'1px solid #E2E8E2',textAlign:'center'}}>
          <div style={{fontSize:11,color:C.muted}}>Eunomia Pharma Services &middot; hello@eunomiapharmaservices.com</div>
        </div>
      </div>

      {mcResult ? (
        <Alert type={mcResult.success?'success':'error'}>
          {mcResult.success ? (
            <span>Draft created in Mailchimp! <a href={mcResult.editUrl} target="_blank" rel="noreferrer" style={{color:C.blue,fontWeight:600}}>Open in Mailchimp to schedule</a></span>
          ) : 'Mailchimp error: '+(mcResult.error||'Unknown error')}
        </Alert>
      ) : null}

      {!mcResult||!mcResult.success ? (
        <button onClick={onSend} disabled={sending}
          style={{background:sending?C.grayL:C.blue,color:sending?C.muted:'#fff',border:'none',borderRadius:10,padding:'14px 28px',fontSize:14,fontWeight:700,cursor:sending?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10,width:'100%'}}>
          {sending ? <Spin s={16}/> : null}
          {sending ? 'Sending to Mailchimp...' : 'Send to Mailchimp as Draft - '+(mc&&mc.subscribers?mc.subscribers.toLocaleString():'834')+' subscribers'}
        </button>
      ) : null}
    </div>
  );
}

// -- Main App -----------------------------------------------------------------
function App(){
  var [tab,setTab]=useState('overview');
  var [mc,setMc]=useState(null);
  var [ht,setHt]=useState(null);
  var [li,setLi]=useState(null);
  var [sr,setSr]=useState(null);
  var [loading,setLoading]=useState({mc:true,ht:true,li:true,sr:true});
  var [errors,setErrors]=useState({});
  var [usingMock,setUsingMock]=useState({});

  var [composerOpen,setComposerOpen]=useState(false);
  var [step,setStep]=useState('topics');
  var [topics,setTopics]=useState([]);
  var [topicLoading,setTopicLoading]=useState(false);
  var [selTopics,setSelTopics]=useState([]);
  var [draft,setDraft]=useState('');
  var [draftSubj,setDraftSubj]=useState('');
  var [draftLoading,setDraftLoading]=useState(false);
  var [sending,setSending]=useState(false);
  var [mcResult,setMcResult]=useState(null);

  var [chatMsg,setChatMsg]=useState('');
  var [chatHist,setChatHist]=useState([]);
  var [chatLoading,setChatLoading]=useState(false);
  var chatEnd=useRef(null);

  useEffect(function(){loadAll();},[]);
  useEffect(function(){if(chatEnd.current)chatEnd.current.scrollIntoView({behavior:'smooth'});},[chatHist]);

  async function loadAll(){
    setLoading({mc:true,ht:true,li:true,sr:true});
    setErrors({});setUsingMock({});
    var res=await Promise.all([
      apiGet('/api/mailchimp?action=stats'),
      apiGet('/api/hunter?action=account'),
      apiGet('/api/linkedin?action=profile'),
      apiGet('/api/salesrobot?action=campaigns'),
    ]);
    var mcD=res[0],htD=res[1],liD=res[2],srD=res[3];
    var errs={},mock={};
    if(mcD.error){errs.mc=mcD.error;mock.mc=true;setMc(MOCK.mc);}else setMc(mcD);
    if(htD.error){errs.ht=htD.error;mock.ht=true;setHt(MOCK.ht);}else setHt(htD);
    if(liD.error){errs.li=liD.error;mock.li=true;setLi(MOCK.li);}else setLi(liD);
    if(srD.error){errs.sr=srD.error;mock.sr=true;setSr(MOCK.sr);}else setSr(srD);
    setErrors(errs);setUsingMock(mock);
    setLoading({mc:false,ht:false,li:false,sr:false});
  }

  async function genTopics(){
    setTopicLoading(true);setTopics([]);
    var sys='You are a pharma compliance marketing expert for Eunomia, a UK consultancy. Suggest 6 newsletter topics for pharma compliance professionals. Respond ONLY with a JSON array, no markdown. Each item: {"title":"...","hook":"one sentence why this matters now","tags":["PMCPA","ABPI","ANSM","FCPA","Digital","Training","Strategy"]}';
    try{
      var raw='';
      await callClaude([{role:'user',content:'Generate 6 newsletter topics for Eunomia. Today is May 2026.'}],sys,function(c){raw=c;});
      setTopics(JSON.parse(raw.replace(/```json|```/g,'').trim()));
    }catch(e){
      setTopics([
        {title:'PMCPA Social Media Guidance 2026: Practical Steps',hook:'New guidance changes how pharma teams use LinkedIn and X.',tags:['PMCPA','Digital']},
        {title:'ABPI Code 2024: Six Months On',hook:'Real-world compliance implications of the new code.',tags:['ABPI']},
        {title:'FCPA 2026: UK Pharma Firms Still At Risk',hook:'Recent DOJ enforcement actions with EU connections.',tags:['FCPA']},
        {title:'Digital HCP Engagement: Drawing the Line',hook:'Where promotional content ends and education begins.',tags:['ANSM','Digital']},
        {title:'Building a Compliance-First Medical Affairs Team',hook:'Training frameworks that satisfy PMCPA requirements.',tags:['Training']},
        {title:'Patient Organisation Relationships Under ABPI',hook:'Updated requirements most companies are still getting wrong.',tags:['ABPI','Strategy']},
      ]);
    }
    setTopicLoading(false);
  }

  async function genDraft(){
    setStep('drafting');setDraftLoading(true);setDraft('');setDraftSubj('');
    var chosen=topics.filter(function(_,i){return selTopics.indexOf(i)>=0;});
    var tlist=chosen.map(function(t){return '- '+t.title+': '+t.hook;}).join('\n');
    var sys='You are a senior compliance marketing writer for Eunomia. Write a newsletter. Format exactly:\nSUBJECT: [subject line]\n---\n[Opening hook sentence]\n\n[2-3 sections with **bold headings**]\n\n[Closing CTA to contact Eunomia]\n\nUnder 400 words. Expert but readable.';
    try{
      var full=await callClaude(
        [{role:'user',content:'Write newsletter covering:\n'+tlist+'\n\nAudience: pharma compliance professionals. May 2026.'}],
        sys,
        function(c){setDraft(c);}
      );
      var m=full.match(/SUBJECT:\s*(.+)/);
      if(m)setDraftSubj(m[1].trim());
    }catch(e){setDraft('Error: '+e.message);}
    setDraftLoading(false);
  }

  async function sendToMailchimp(){
    setSending(true);setMcResult(null);
    var body=draft.replace(/SUBJECT:.+\n?---\n?/,'').trim();
    var result=await apiPost('/api/mailchimp?action=create-campaign',{subject:draftSubj,body:body});
    setMcResult(result);setSending(false);
  }

  async function sendChat(){
    if(!chatMsg.trim()||chatLoading)return;
    var msg=chatMsg.trim();setChatMsg('');
    var hist=chatHist.concat([{role:'user',content:msg}]);
    setChatHist(hist);setChatLoading(true);
    var sys='You are Eunomia marketing assistant. Data: Mailchimp: '+(mc?mc.subscribers+' subscribers, '+mc.openRate+'% open rate. Last newsletter sent '+daysSince(mc.lastSent)+' days ago. Next due: '+fmtDate(nextDue(mc.lastSent))+' ('+daysUntil(mc.lastSent)+' days away).':'Not connected.')+' Hunter: '+(ht?ht.creditsUsed+'/'+ht.creditsTotal+' credits used.':'Not connected.')+' Sales Robot: '+(sr?sr.summary.activeSequences+' active sequences, '+sr.summary.replyRate+'% reply rate.':'Not connected.')+' Give specific actionable advice for Eunomia pharma compliance marketing.';
    try{
      await callClaude(hist,sys,function(c){setChatHist(hist.concat([{role:'assistant',content:c}]));});
    }catch(e){setChatHist(hist.concat([{role:'assistant',content:'Error: '+e.message}]));}
    setChatLoading(false);
  }

  function openNewsletter(){
    setTab('newsletter');setComposerOpen(true);setStep('topics');setTopics([]);setSelTopics([]);setDraft('');setDraftSubj('');setMcResult(null);
  }

  function statusDot(key,name){
    if(loading[key])return <span style={{fontSize:11,background:'#ffffff20',color:'#a8c5a9',borderRadius:5,padding:'3px 8px',fontWeight:600}}>{name}</span>;
    if(usingMock[key])return <span style={{fontSize:11,background:'#E8651A25',color:'#E8651A',border:'1px solid #E8651A50',borderRadius:5,padding:'3px 8px',fontWeight:600}}>Demo: {name}</span>;
    return <span style={{fontSize:11,background:'#3d8b4025',color:'#5db860',border:'1px solid #3d8b4050',borderRadius:5,padding:'3px 8px',fontWeight:600}}>Live: {name}</span>;
  }

  var tabs=[
    {id:'overview',label:'Overview'},{id:'linkedin',label:'LinkedIn'},
    {id:'salesrobot',label:'Sales Robot'},{id:'mailchimp',label:'Mailchimp'},
    {id:'hunter',label:'Hunter.io'},{id:'newsletter',label:'Newsletter'},
  ];

  return(
    <div style={{minHeight:'100vh'}}>
      <div style={{background:'#2C3E2D',padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:60,position:'sticky',top:0,zIndex:10,borderBottom:'2px solid #E8651A'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
            <circle cx="19" cy="19" r="18" fill="white" stroke="#E8651A" strokeWidth="2"/>
            <circle cx="19" cy="19" r="14" fill="none" stroke="#3d8b40" strokeWidth="1.5"/>
            <path d="M12 19 L17 24 L26 13" stroke="#3d8b40" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M19 4 A15 15 0 0 1 34 19" stroke="#E8651A" strokeWidth="2" strokeLinecap="round" fill="none"/>
          </svg>
          <div>
            <div style={{color:'#fff',fontWeight:700,fontSize:14,letterSpacing:'0.02em',lineHeight:1.1}}>EUNOMIA PHARMA</div>
            <div style={{color:'#a8c5a9',fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase'}}>Marketing Hub</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          {statusDot('li','LinkedIn')}
          {statusDot('sr','Sales Robot')}
          {statusDot('mc','Mailchimp')}
          {statusDot('ht','Hunter.io')}
          <button onClick={loadAll} style={{background:'none',border:'1px solid #ffffff40',borderRadius:7,color:'#a8c5a9',fontSize:12,padding:'4px 12px',cursor:'pointer',marginLeft:4}}>Refresh</button>
        </div>
      </div>

      <div style={{borderBottom:'1px solid #E2E8E2',background:'#fff',padding:'0 24px',display:'flex',gap:4,overflowX:'auto'}}>
        {tabs.map(function(t){
          return <button key={t.id} className={'tab '+(tab===t.id?'on':'')} onClick={function(){setTab(t.id);}}>{t.label}</button>;
        })}
      </div>

      <div style={{padding:'24px',maxWidth:960,margin:'0 auto',display:'flex',flexDirection:'column',gap:18}}>

        {tab==='overview' ? (
          <div style={{display:'flex',flexDirection:'column',gap:18}}>
            {Object.keys(usingMock).length>0 ? (
              <Alert type="warning">Demo mode: {Object.keys(usingMock).join(', ')} showing sample data. Add API keys in Vercel to see live data.</Alert>
            ) : null}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
              <Stat label="LinkedIn Connections" value={loading.li?'...':li&&li.connections?li.connections.toLocaleString():null} sub={li&&li.name&&li.name!=='undefined undefined'?li.name:''}/>
              <Stat label="Reply Rate" value={loading.sr?'...':sr&&sr.summary?sr.summary.replyRate+'%':null} sub={sr?sr.summary.replies+' replies from '+sr.summary.messagesSent+' sent':''} color={C.teal}/>
              <Stat label="Open Rate" value={loading.mc?'...':mc&&mc.openRate?mc.openRate+'%':null} sub={mc?mc.subscribers.toLocaleString()+' subscribers':''} color={C.amber}/>
              <Stat label="Hunter Credits" value={loading.ht?'...':ht?ht.creditsUsed+'/'+ht.creditsTotal:null} sub={ht?ht.plan:''} color={C.green}/>
            </div>

            {mc&&mc.lastSent ? (
              <div style={{background:daysUntil(mc.lastSent)<=7?C.amberL:C.blueL,border:'1px solid '+(daysUntil(mc.lastSent)<=7?C.amber:C.blue)+'30',borderRadius:12,padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:daysUntil(mc.lastSent)<=7?C.amber:C.blue,marginBottom:4}}>
                    {daysUntil(mc.lastSent)<=7?'Newsletter due soon':'Newsletter schedule'}
                  </div>
                  <div style={{fontSize:14,fontWeight:600}}>Next due: {fmtDate(nextDue(mc.lastSent))} <span style={{fontWeight:400,color:C.muted}}>({daysUntil(mc.lastSent)} days)</span></div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>Last sent {daysSince(mc.lastSent)} days ago</div>
                </div>
                <button onClick={openNewsletter}
                  style={{background:C.blue,color:'#fff',border:'none',borderRadius:8,padding:'10px 18px',fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                  Create Newsletter
                </button>
              </div>
            ) : null}

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              <div className="card">
                <SH>AI Marketing Assistant</SH>
                <div style={{background:C.grayL,borderRadius:10,padding:12,minHeight:200,maxHeight:280,overflowY:'auto',display:'flex',flexDirection:'column',gap:8,marginBottom:10}}>
                  {chatHist.length===0 ? <p style={{color:C.muted,fontSize:13}}>Ask about your platform performance, newsletter timing, outreach strategy...</p> : null}
                  {chatHist.map(function(m,i){
                    return(
                      <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
                        <div className={m.role==='user'?'cu':'ca'}>{m.content}</div>
                      </div>
                    );
                  })}
                  {chatLoading ? <div className="ca"><Spin s={14}/></div> : null}
                  <div ref={chatEnd}/>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <input value={chatMsg} onChange={function(e){setChatMsg(e.target.value);}}
                    onKeyDown={function(e){if(e.key==='Enter')sendChat();}}
                    placeholder="How is my reply rate? When should I send next?"
                    style={{flex:1,border:'1px solid #E2E8E2',borderRadius:8,padding:'8px 12px',fontSize:13,outline:'none'}}/>
                  <button onClick={sendChat} disabled={chatLoading}
                    style={{background:C.blue,color:'#fff',border:'none',borderRadius:8,padding:'8px 16px',cursor:'pointer',fontWeight:600,fontSize:13}}>Send</button>
                </div>
              </div>

              <div className="card">
                <SH>Recent Mailchimp Campaigns</SH>
                {loading.mc ? <div style={{color:C.muted,fontSize:13}}>Loading...</div>
                  : mc&&mc.campaigns&&mc.campaigns.length>0 ? mc.campaigns.map(function(c,i){
                  return(
                    <div key={i} className="row">
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600,fontSize:13}}>{c.name}</div>
                        <div style={{fontSize:12,color:C.muted}}>{c.date} &middot; {typeof c.sent==='number'?c.sent.toLocaleString():c.sent} sent</div>
                      </div>
                      <Pill label={c.opens} color={C.green}/>
                      <Pill label={c.clicks} color={C.blue}/>
                    </div>
                  );
                }) : <div style={{color:C.muted,fontSize:13}}>No campaigns found.</div>}
              </div>
            </div>
          </div>
        ) : null}

        {tab==='linkedin' ? <LinkedInTab li={li} usingMock={usingMock.li}/> : null}

        {tab==='salesrobot' ? <SalesRobotTab sr={sr} usingMock={usingMock.sr}/> : null}

        {tab==='mailchimp' ? <MailchimpTab mc={mc} usingMock={usingMock.mc} onCreateNewsletter={openNewsletter}/> : null}

        {tab==='hunter' ? <HunterTab ht={ht} usingMock={usingMock.ht}/> : null}

        {tab==='newsletter' ? (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            {mc&&mc.lastSent ? (
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
                <Stat label="Last newsletter" value={daysSince(mc.lastSent)+'d ago'} sub={mc.lastSubject?mc.lastSubject.slice(0,42)+'...':''}/>
                <Stat label="Next due" value={fmtDate(nextDue(mc.lastSent))} sub={daysUntil(mc.lastSent)+' days away'} color={daysUntil(mc.lastSent)<=7?C.amber:C.green}/>
                <Stat label="Subscribers" value={mc.subscribers?mc.subscribers.toLocaleString():null} sub="Will receive newsletter" color={C.blue}/>
              </div>
            ) : null}

            {!composerOpen ? (
              <div className="card" style={{textAlign:'center',padding:'36px 20px'}}>
                <div style={{fontSize:36,marginBottom:12}}>✦</div>
                <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>Create your next newsletter</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:24}}>AI researches current pharma regulatory topics, you choose, then it drafts a full newsletter and sends to Mailchimp.</div>
                <button onClick={function(){setComposerOpen(true);setStep('topics');setTopics([]);setSelTopics([]);setDraft('');setDraftSubj('');setMcResult(null);}}
                  style={{background:C.blue,color:'#fff',border:'none',borderRadius:10,padding:'13px 30px',fontSize:14,fontWeight:700,cursor:'pointer'}}>
                  Start Newsletter Creator
                </button>
              </div>
            ) : null}

            {composerOpen&&step==='topics' ? (
              <div className="card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                  <SH>Step 1: Choose topics</SH>
                  <button onClick={function(){setComposerOpen(false);}} style={{background:'none',border:'none',cursor:'pointer',color:C.muted,fontSize:22,lineHeight:1}}>x</button>
                </div>
                {topics.length===0&&!topicLoading ? (
                  <div style={{textAlign:'center',padding:'20px 0'}}>
                    <div style={{fontSize:13,color:C.muted,marginBottom:16}}>AI will research current pharma regulatory topics for your audience</div>
                    <button onClick={genTopics} style={{background:C.blue,color:'#fff',border:'none',borderRadius:8,padding:'10px 24px',fontSize:13,fontWeight:600,cursor:'pointer'}}>Research Topics</button>
                  </div>
                ) : null}
                {topicLoading ? (
                  <div style={{textAlign:'center',padding:'28px 0',color:C.muted,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
                    <Spin/>
                    <span>Researching topics...</span>
                  </div>
                ) : null}
                {topics.length>0&&!topicLoading ? (
                  <div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
                      {topics.map(function(t,i){
                        var isSel=selTopics.indexOf(i)>=0;
                        return(
                          <div key={i} className={'tc '+(isSel?'sel':'')}
                            onClick={function(){setSelTopics(function(p){return p.indexOf(i)>=0?p.filter(function(x){return x!==i;}):[...p,i];});}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                              <span style={{fontSize:13,fontWeight:600,flex:1,marginRight:8}}>{t.title}</span>
                              <div style={{width:20,height:20,borderRadius:'50%',border:'2px solid '+(isSel?C.blue:'#E2E8E2'),background:isSel?C.blue:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:11,fontWeight:800,color:'#fff'}}>
                                {isSel?'v':''}
                              </div>
                            </div>
                            <p style={{fontSize:12,color:C.muted,margin:'0 0 8px'}}>{t.hook}</p>
                            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                              {t.tags.map(function(tag){
                                return <span key={tag} style={{fontSize:10,fontWeight:600,background:(tagColor[tag]||C.gray)+'20',color:tagColor[tag]||C.gray,borderRadius:4,padding:'2px 6px'}}>{tag}</span>;
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{display:'flex',gap:10}}>
                      <button onClick={genTopics} style={{background:'none',border:'1px solid #E2E8E2',borderRadius:8,padding:'8px 14px',fontSize:13,cursor:'pointer'}}>Regenerate</button>
                      <button disabled={selTopics.length===0} onClick={genDraft}
                        style={{background:selTopics.length>0?C.blue:C.grayL,color:selTopics.length>0?'#fff':C.muted,border:'none',borderRadius:8,padding:'10px 20px',fontSize:13,fontWeight:600,cursor:selTopics.length>0?'pointer':'default'}}>
                        Draft Newsletter ({selTopics.length} topic{selTopics.length!==1?'s':''})
                      </button>
                    </div>
                  </div>
                ) : null}
              </div>
            ) : null}

            {composerOpen&&step==='drafting' ? (
              <NewsletterPreview
                draft={draft} draftSubj={draftSubj} draftLoading={draftLoading}
                mcResult={mcResult} sending={sending} mc={mc}
                onBack={function(){setStep('topics');setDraft('');setDraftSubj('');setMcResult(null);}}
                onRegenerate={genDraft} onSend={sendToMailchimp}
              />
            ) : null}
          </div>
        ) : null}

      </div>
    </div>
  );
}


// -- SalesRobotTab -------------------------------------------------------------
function SalesRobotTab(props) {
  var sr = props.sr, usingMock = props.usingMock;
  var [showCreator, setShowCreator] = useState(false);
  var [jobTitle, setJobTitle] = useState('');
  var [industry, setIndustry] = useState('Pharmaceutical');
  var [companySize, setCompanySize] = useState('500-5000');
  var [topic, setTopic] = useState('');
  var [generating, setGenerating] = useState(false);
  var [campaign, setCampaign] = useState(null);
  var [copied, setCopied] = useState({});
  var [genError, setGenError] = useState('');

  var jobTitles = [
    'Medical Affairs Director', 'Chief Compliance Officer', 'Regulatory Affairs VP',
    'Head of Medical Affairs', 'Compliance Manager', 'Legal Counsel - Healthcare',
    'Medical Science Liaison Manager', 'VP Medical Affairs', 'Director of Regulatory Affairs',
    'Chief Medical Officer'
  ];

  var topics = [
    'PMCPA social media guidance 2026',
    'ABPI Code 2024 compliance',
    'ABAC and anti-bribery framework',
    'HCP engagement and compliance',
    'Medical affairs compliance training',
    'Due diligence and third party risk',
    'Gifts and hospitality policy',
    'Conflict of interest management',
    'MSL compliance training',
    'Promotional materials approval'
  ];

  async function generateCampaign() {
    if (!jobTitle.trim()) { setGenError('Please enter a job title to target.'); return; }
    setGenerating(true); setCampaign(null); setGenError('');

    var prompt = 'Generate a LinkedIn Sales Robot outreach campaign for Eunomia Pharma Services targeting ' + jobTitle + ' in ' + industry + ' companies (' + companySize + ' employees).' +
      (topic ? ' The campaign topic is: ' + topic + '.' : '') +
      ' Eunomia is a UK pharma compliance consultancy specialising in ABPI Code, PMCPA, ABAC, due diligence, compliance training for Sales Reps and MSLs, gifts and hospitality, conflict of interest, and data analytics dashboards.' +
      ' Generate a campaign with: (1) a campaign name, (2) a target ICP description for Sales Navigator filters, (3) Message 1: connection request note (under 300 characters), (4) Message 2: follow-up value message (Day 5, under 500 characters), (5) Message 3: direct ask (Day 10, under 500 characters).' +
      ' Messages must sound human, not salesy. Reference a specific compliance pain point. No emojis.' +
      ' Respond ONLY as JSON: {"campaignName":"...","icp":"...","message1":"...","message2":"...","message3":"...","targetTitle":"...","targetIndustry":"..."}';

    try {
      var raw = '';
      await callClaude(
        [{role:'user',content:prompt}],
        'You are a B2B LinkedIn outreach expert for pharma compliance. Write messages that sound like they come from a senior compliance consultant, not a salesperson. Be specific and reference real regulatory issues.',
        function(chunk) { raw = chunk; }
      );
      var cleaned = raw.replace(/```json|```/g,'').trim();
      var data = JSON.parse(cleaned);
      setCampaign(data);
    } catch(e) {
      setGenError('Error generating campaign: ' + e.message);
    }
    setGenerating(false);
  }

  function copyText(key, text) {
    navigator.clipboard.writeText(text).then(function() {
      setCopied(function(p) { var n = Object.assign({}, p); n[key] = true; return n; });
      setTimeout(function() {
        setCopied(function(p) { var n = Object.assign({}, p); n[key] = false; return n; });
      }, 2000);
    });
  }

  function charColor(text, limit) {
    var len = text ? text.length : 0;
    if (len > limit) return C.red;
    if (len > limit * 0.85) return C.amber;
    return C.muted;
  }

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {usingMock ? <Alert type="warning">Showing your real campaign data from Sales Robot. To connect live API, contact Sales Robot support for your API endpoint URL.</Alert> : null}

      {sr&&sr.summary ? (
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
          <Stat label="Active sequences" value={sr.summary.activeSequences}/>
          <Stat label="Messages sent" value={sr.summary.messagesSent} sub="This period"/>
          <Stat label="Replies" value={sr.summary.replies} color={C.teal}/>
          <Stat label="Reply rate" value={sr.summary.replyRate+'%'} color={parseFloat(sr.summary.replyRate)>=15?C.green:C.amber}/>
        </div>
      ) : null}

      {/* Campaign performance */}
      <div className="card">
        <SH>Campaign Performance</SH>
        {sr&&sr.campaigns&&sr.campaigns.length>0 ? (
          <div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 90px 70px 80px 90px',gap:8,fontSize:11,fontWeight:600,color:C.muted,paddingBottom:8,borderBottom:'1px solid #E2E8E2',textTransform:'uppercase',letterSpacing:'0.05em'}}>
              <span>Campaign</span><span style={{textAlign:'center'}}>Accepted</span><span style={{textAlign:'center'}}>Replies</span><span style={{textAlign:'right'}}>Rate</span><span style={{textAlign:'right'}}>Status</span>
            </div>
            {sr.campaigns.map(function(s,i) {
              var rate = parseFloat(s.rate);
              return (
                <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 90px 70px 80px 90px',gap:8,alignItems:'center',padding:'12px 0',borderBottom:'1px solid #E2E8E2'}}>
                  <div style={{fontWeight:600,fontSize:13}}>{s.name}</div>
                  <span style={{textAlign:'center',fontSize:13}}>{s.sent}</span>
                  <span style={{textAlign:'center',fontSize:13}}>{s.replies}</span>
                  <div style={{textAlign:'right'}}>
                    <Pill label={s.rate+'%'} color={rate>=22?C.green:rate>=15?C.teal:rate>=10?C.amber:C.red}/>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <Pill label={s.status} color={s.status==='active'?C.green:C.gray}/>
                  </div>
                </div>
              );
            })}
            <div style={{marginTop:12,padding:'10px 14px',background:C.blueL,borderRadius:8,fontSize:13}}>
              <strong>Your average reply rate of {sr.summary.replyRate}% is well above the industry average of 10-15%.</strong> The Legal and Medical Directors campaigns are your strongest performers.
            </div>
          </div>
        ) : <div style={{color:C.muted,fontSize:13}}>No campaigns found.</div>}
      </div>

      {/* Campaign Creator */}
      <div className="card" style={{border: showCreator ? '1.5px solid #3d8b40' : '1px solid #E2E8E2'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>AI Campaign Creator</div>
            <div style={{fontSize:13,color:C.muted}}>Generate a targeted outreach campaign with 3-step message sequence</div>
          </div>
          <button onClick={function(){setShowCreator(function(p){return !p;});setCampaign(null);setGenError('');}}
            style={{background:showCreator?C.blueL:C.blue,color:showCreator?C.blue:'#fff',border:'1.5px solid '+(showCreator?C.blue:'transparent'),borderRadius:9,padding:'10px 20px',fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
            {showCreator ? 'Close' : '+ Create Campaign'}
          </button>
        </div>

        {showCreator ? (
          <div style={{marginTop:20,borderTop:'1px solid #E2E8E2',paddingTop:20}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
              {/* Target job title */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:C.muted,display:'block',marginBottom:6}}>TARGET JOB TITLE *</label>
                <input list="jobtitles" value={jobTitle} onChange={function(e){setJobTitle(e.target.value);}}
                  placeholder="e.g. Chief Compliance Officer"
                  style={{width:'100%',border:'1px solid #E2E8E2',borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none'}}/>
                <datalist id="jobtitles">
                  {jobTitles.map(function(t){return <option key={t} value={t}/>;})}</datalist>
              </div>

              {/* Industry */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:C.muted,display:'block',marginBottom:6}}>INDUSTRY</label>
                <select value={industry} onChange={function(e){setIndustry(e.target.value);}}
                  style={{width:'100%',border:'1px solid #E2E8E2',borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none',background:'#fff'}}>
                  <option>Pharmaceutical</option>
                  <option>Biotech</option>
                  <option>Medical Devices</option>
                  <option>CRO / Clinical Research</option>
                  <option>Healthcare</option>
                  <option>Life Sciences</option>
                </select>
              </div>

              {/* Company size */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:C.muted,display:'block',marginBottom:6}}>COMPANY SIZE</label>
                <select value={companySize} onChange={function(e){setCompanySize(e.target.value);}}
                  style={{width:'100%',border:'1px solid #E2E8E2',borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none',background:'#fff'}}>
                  <option>50-200</option>
                  <option>200-500</option>
                  <option>500-5000</option>
                  <option>1001-5000</option>
                  <option>5000+</option>
                </select>
              </div>

              {/* Topic hook */}
              <div>
                <label style={{fontSize:12,fontWeight:600,color:C.muted,display:'block',marginBottom:6}}>COMPLIANCE TOPIC (optional)</label>
                <select value={topic} onChange={function(e){setTopic(e.target.value);}}
                  style={{width:'100%',border:'1px solid #E2E8E2',borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none',background:'#fff'}}>
                  <option value="">-- Auto-select best topic --</option>
                  {topics.map(function(t){return <option key={t} value={t}>{t}</option>;})}</select>
              </div>
            </div>

            {genError ? <Alert type="error">{genError}</Alert> : null}

            <button onClick={generateCampaign} disabled={generating||!jobTitle.trim()}
              style={{background:jobTitle.trim()&&!generating?C.blue:C.grayL,color:jobTitle.trim()&&!generating?'#fff':C.muted,border:'none',borderRadius:9,padding:'11px 24px',fontSize:14,fontWeight:700,cursor:jobTitle.trim()&&!generating?'pointer':'default',display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
              {generating ? <Spin s={16}/> : null}
              {generating ? 'Generating campaign...' : 'Generate Campaign'}
            </button>

            {/* Generated campaign output */}
            {campaign ? (
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                {/* Campaign name + ICP */}
                <div style={{background:C.blueL,borderRadius:10,padding:'14px 16px'}}>
                  <div style={{fontSize:11,fontWeight:600,color:C.blue,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Campaign Name</div>
                  <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:12}}>{campaign.campaignName}</div>
                  <div style={{fontSize:11,fontWeight:600,color:C.blue,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Sales Navigator ICP Filters</div>
                  <div style={{fontSize:13,color:C.text,lineHeight:1.6}}>{campaign.icp}</div>
                </div>

                {/* Message 1 */}
                <div style={{border:'1px solid #E2E8E2',borderRadius:10,overflow:'hidden'}}>
                  <div style={{background:'#2C3E2D',padding:'8px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div>
                      <span style={{color:'#fff',fontWeight:600,fontSize:13}}>Message 1</span>
                      <span style={{color:'#a8c5a9',fontSize:12,marginLeft:10}}>Connection request (Day 1)</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span style={{fontSize:11,color:charColor(campaign.message1,300)}}>{campaign.message1?campaign.message1.length:0}/300</span>
                      <button onClick={function(){copyText('msg1',campaign.message1);}}
                        style={{background:copied.msg1?C.green:'#ffffff30',color:'#fff',border:'none',borderRadius:6,padding:'4px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        {copied.msg1?'Copied!':'Copy'}
                      </button>
                    </div>
                  </div>
                  <div style={{padding:'14px 16px',fontSize:13,lineHeight:1.7,color:C.text,whiteSpace:'pre-wrap'}}>{campaign.message1}</div>
                </div>

                {/* Message 2 */}
                <div style={{border:'1px solid #E2E8E2',borderRadius:10,overflow:'hidden'}}>
                  <div style={{background:'#1a5c1d',padding:'8px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div>
                      <span style={{color:'#fff',fontWeight:600,fontSize:13}}>Message 2</span>
                      <span style={{color:'#a8c5a9',fontSize:12,marginLeft:10}}>Follow-up value message (Day 5)</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span style={{fontSize:11,color:charColor(campaign.message2,500)}}>{campaign.message2?campaign.message2.length:0}/500</span>
                      <button onClick={function(){copyText('msg2',campaign.message2);}}
                        style={{background:copied.msg2?C.green:'#ffffff30',color:'#fff',border:'none',borderRadius:6,padding:'4px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        {copied.msg2?'Copied!':'Copy'}
                      </button>
                    </div>
                  </div>
                  <div style={{padding:'14px 16px',fontSize:13,lineHeight:1.7,color:C.text,whiteSpace:'pre-wrap'}}>{campaign.message2}</div>
                </div>

                {/* Message 3 */}
                <div style={{border:'1px solid #E2E8E2',borderRadius:10,overflow:'hidden'}}>
                  <div style={{background:C.amber,padding:'8px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div>
                      <span style={{color:'#fff',fontWeight:600,fontSize:13}}>Message 3</span>
                      <span style={{color:'#ffe0cc',fontSize:12,marginLeft:10}}>Direct ask (Day 10)</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span style={{fontSize:11,color:charColor(campaign.message3,500)}}>{campaign.message3?campaign.message3.length:0}/500</span>
                      <button onClick={function(){copyText('msg3',campaign.message3);}}
                        style={{background:copied.msg3?C.green:'#ffffff30',color:'#fff',border:'none',borderRadius:6,padding:'4px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        {copied.msg3?'Copied!':'Copy'}
                      </button>
                    </div>
                  </div>
                  <div style={{padding:'14px 16px',fontSize:13,lineHeight:1.7,color:C.text,whiteSpace:'pre-wrap'}}>{campaign.message3}</div>
                </div>

                {/* Actions */}
                <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                  <button onClick={generateCampaign} disabled={generating}
                    style={{background:'none',border:'1px solid #E2E8E2',borderRadius:8,padding:'8px 16px',fontSize:13,cursor:'pointer',color:C.muted}}>
                    Regenerate
                  </button>
                  <a href="https://app.salesrobot.co/campaigns/new" target="_blank" rel="noreferrer"
                    style={{background:C.blue,color:'#fff',border:'none',borderRadius:8,padding:'9px 18px',fontSize:13,fontWeight:700,cursor:'pointer',textDecoration:'none',display:'flex',alignItems:'center',gap:6}}>
                    Open Sales Robot to create campaign
                  </a>
                </div>

                <div style={{background:C.grayL,borderRadius:8,padding:'10px 14px',fontSize:12,color:C.muted,lineHeight:1.6}}>
                  How to use: Copy each message above, then open Sales Robot and create a new campaign. Paste Message 1 as your connection request note, Message 2 as your first follow-up, and Message 3 as your second follow-up. Set delays to Day 5 and Day 10.
                </div>
              </div>
            ) : null}
          </div>
        ) : null}
      </div>
    </div>
  );
}
ReactDOM.cre
